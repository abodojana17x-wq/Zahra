<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0e14">
<meta name="description" content="رقيم 2.0 — مساعد ذكي يعمل بدون إنترنت: حساب دقيق، وحدات، طقس ومعلومات بمصادر، وصراحة عند الجهل. ملف HTML واحد.">
<title>رقيم 2.0 — مساعد ذكي صادق</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2318d3c5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='46' font-size='38' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3E%D8%B1%3C/text%3E%3C/svg%3E">

<style>
/* ============================================================
   رقيم 2.0 — Design System (RTL، Dark/Light، متجاوب)
   ============================================================ */
:root{
  --font-ar:"Noto Kufi Arabic","Cairo","Tajawal","IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Fira Code","JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;
  --accent-1:#7c5cff; --accent-2:#18d3c5; --accent-3:#ff6b9d;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ff5f6d;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --ease:cubic-bezier(.22,.85,.28,1);
  --header-h:62px;
}
html[data-theme="dark"]{
  --bg:#0a0e14; --bg-2:#0e131b;
  --panel:rgba(20,26,36,.72); --panel-solid:#141a24;
  --bot-bg:rgba(255,255,255,.035); --bot-bg-2:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --text:#e9eef6; --text-dim:#9aa7bb; --text-faint:#6b7789;
  --user-grad:linear-gradient(135deg,#6d4bff 0%,#8b5cf6 45%,#17b9c9 100%);
  --code-bg:rgba(8,12,18,.85);
  --hover:rgba(255,255,255,.06);
  --glow:0 0 0 1px rgba(124,92,255,.35),0 10px 40px -8px rgba(124,92,255,.45);
  --shadow-1:0 1px 2px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.10);
  --shadow-2:0 12px 40px rgba(0,0,0,.28);
  --blob-o:.55;
}
html[data-theme="light"]{
  --bg:#f6f7fb; --bg-2:#eef0f7;
  --panel:rgba(255,255,255,.78); --panel-solid:#fff;
  --bot-bg:#fff; --bot-bg-2:#f4f6fb;
  --border:rgba(16,24,40,.10); --border-strong:rgba(16,24,40,.18);
  --text:#131a26; --text-dim:#5a6577; --text-faint:#8b95a6;
  --user-grad:linear-gradient(135deg,#5b34f0 0%,#7c5cff 45%,#0fa3b1 100%);
  --code-bg:#f1f3f9;
  --hover:rgba(16,24,40,.05);
  --glow:0 0 0 1px rgba(92,52,240,.25),0 12px 40px -12px rgba(92,52,240,.35);
  --shadow-1:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --shadow-2:0 12px 40px rgba(16,24,40,.14);
  --blob-o:.42;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-ar);font-size:15px;line-height:1.8;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  transition:background .45s var(--ease),color .45s var(--ease);
}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:rgba(124,92,255,.35)}

/* ---------- خلفية ---------- */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob-o);transition:opacity .6s var(--ease)}
.b1{width:46vw;height:46vw;background:radial-gradient(circle at 30% 30%,#7c5cff,transparent 68%);top:-14vw;right:-8vw;animation:float1 22s var(--ease) infinite}
.b2{width:40vw;height:40vw;background:radial-gradient(circle at 60% 40%,#18d3c5,transparent 68%);bottom:-16vw;left:-10vw;animation:float2 26s var(--ease) infinite}
.b3{width:32vw;height:32vw;background:radial-gradient(circle at 50% 50%,#ff6b9d,transparent 70%);top:38%;left:44%;animation:float3 30s var(--ease) infinite}
@keyframes float1{50%{transform:translate3d(-4vw,5vh,0) scale(1.08)}}
@keyframes float2{50%{transform:translate3d(5vw,-6vh,0) scale(1.12)}}
@keyframes float3{50%{transform:translate3d(-6vw,-4vh,0) scale(.9)}}

/* ---------- تخطيط ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:290px 1fr;height:100dvh}
.sidebar{display:flex;flex-direction:column;gap:14px;padding:16px 14px;background:var(--bg-2);border-inline-end:1px solid var(--border);transition:transform .35s var(--ease),background .45s var(--ease)}
.brand{display:flex;align-items:center;gap:11px;padding:6px 6px 2px}
.brand-logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--user-grad);color:#fff;font-weight:800;font-size:20px;line-height:1;box-shadow:var(--glow);flex:none;position:relative}
.brand-logo .v{position:absolute;bottom:-5px;left:-5px;background:var(--accent-2);color:#04211e;font-size:9px;font-weight:800;padding:1px 5px;border-radius:99px;line-height:1.5}
.brand-txt b{display:block;font-size:17px;letter-spacing:.2px}
.brand-txt span{display:block;font-size:11.5px;color:var(--text-faint);margin-top:-3px}
.btn-new{display:flex;align-items:center;justify-content:center;gap:9px;padding:12px 14px;border-radius:14px;font-size:14.5px;font-weight:600;background:var(--panel-solid);border:1px solid var(--border);box-shadow:var(--shadow-1);transition:transform .18s var(--ease),border-color .2s,background .2s}
.btn-new:hover{transform:translateY(-1px);border-color:var(--border-strong);background:var(--hover)}
.btn-new svg{width:17px;height:17px}
.side-label{font-size:11.5px;color:var(--text-faint);padding:2px 8px;letter-spacing:.3px}
.sessions{list-style:none;margin:0;padding:0 2px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.session{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;font-size:13.5px;color:var(--text-dim);cursor:pointer;border:1px solid transparent;transition:background .18s,color .18s,border-color .18s}
.session:hover{background:var(--hover);color:var(--text)}
.session.active{background:var(--panel-solid);border-color:var(--border);color:var(--text);box-shadow:var(--shadow-1)}
.session .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session .del{opacity:0;padding:2px;border-radius:7px;color:var(--text-faint);display:grid;place-items:center;transition:opacity .18s,color .18s}
.session:hover .del{opacity:1}
.session .del:hover{color:#ff6b81;background:rgba(255,107,129,.12)}
.session .del svg{width:14px;height:14px}
.side-foot{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.side-foot .row{display:flex;gap:7px}
.tiny-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:11px;font-size:12.5px;color:var(--text-dim);border:1px solid var(--border);transition:background .18s,color .18s,transform .18s var(--ease)}
.tiny-btn:hover{background:var(--hover);color:var(--text);transform:translateY(-1px)}
.tiny-btn svg{width:15px;height:15px}
.sig{text-align:center;font-size:10.5px;color:var(--text-faint);padding-top:4px}

/* ---------- الرئيسية ---------- */
.main{position:relative;display:flex;flex-direction:column;min-width:0;height:100dvh}
.topbar{height:var(--header-h);flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);z-index:6}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--text-dim);border:1px solid transparent;transition:background .18s,color .18s,border-color .18s,transform .2s var(--ease)}
.icon-btn:hover{background:var(--hover);color:var(--text);border-color:var(--border)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:19px;height:19px}
.menu-btn{display:none}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.who .brand-logo{width:36px;height:36px;border-radius:12px;font-size:18px}
.who .brand-logo .v{font-size:8px;bottom:-4px;left:-4px}
.who-txt{min-width:0}
.who-txt b{display:block;font-size:15.5px}
.status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-faint)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.15);animation:pulse 2.4s infinite}
.status .dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
@keyframes pulse{50%{opacity:.45;transform:scale(.85)}}
.spacer{flex:1}
.badge{font-size:11.5px;color:var(--text-dim);padding:6px 11px;border-radius:99px;border:1px solid var(--border);background:var(--bot-bg);white-space:nowrap}
.badge b{color:var(--accent-2)}
@media (max-width:760px){.badge{display:none}}

/* ---------- الشات ---------- */
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding:0 16px}
.messages{max-width:860px;margin:0 auto;padding:22px 0 26px;display:flex;flex-direction:column}
.welcome{text-align:center;padding:5vh 8px 30px;animation:rise .6s var(--ease) both}
.welcome .halo{width:96px;height:96px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;background:var(--user-grad);color:#fff;font-size:44px;font-weight:800;line-height:1;box-shadow:var(--glow);animation:breath 4s var(--ease) infinite;position:relative}
.welcome .halo .v{position:absolute;bottom:-6px;left:-6px;background:var(--accent-2);color:#04211e;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
@keyframes breath{50%{transform:translateY(-6px) rotate(-2deg)}}
.welcome h1{font-size:clamp(23px,4.4vw,33px);margin:0 0 8px;letter-spacing:.2px}
.welcome h1 em{font-style:normal;background:linear-gradient(100deg,var(--accent-1),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--text-dim);max-width:600px;margin:0 auto 26px;font-size:14.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;text-align:start}
.card{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(10px);transition:transform .22s var(--ease),border-color .22s,box-shadow .22s}
.card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow-2)}
.card .ic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--bot-bg-2);border:1px solid var(--border)}
.card .ic svg{width:17px;height:17px}
.card b{display:block;font-size:13.5px;margin-bottom:2px}
.card span{display:block;font-size:12px;color:var(--text-faint);line-height:1.65}

/* الرسائل */
.msg{display:flex;gap:11px;margin-bottom:20px;align-items:flex-start;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.av{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;line-height:1;user-select:none;background:var(--user-grad);color:#fff;box-shadow:0 4px 16px -4px rgba(124,92,255,.55)}
.msg.bot .av{background:var(--panel-solid);border:1px solid var(--border-strong);color:var(--text);box-shadow:var(--shadow-1)}
.msg.user .av{background:var(--bot-bg-2);border:1px solid var(--border);color:var(--text-dim);font-size:14px}
.body{min-width:0;max-width:min(80%,720px)}
.msg.user .body{display:flex;flex-direction:column;align-items:flex-end}
.bubble{padding:13px 16px;border-radius:var(--r-md);font-size:15px;line-height:1.95;overflow-wrap:break-word;word-break:break-word;background:var(--bot-bg);border:1px solid var(--border);border-start-start-radius:7px;box-shadow:var(--shadow-1)}
.msg.user .bubble{background:var(--user-grad);color:#fff;border:0;border-start-start-radius:var(--r-md);border-start-end-radius:7px;box-shadow:0 8px 26px -10px rgba(109,75,255,.7)}
.bubble p{margin:0 0 10px}
.bubble p:last-child{margin-bottom:0}
.bubble strong{font-weight:700}
.bubble ul,.bubble ol{margin:6px 0 10px;padding-inline-start:20px}
.bubble li{margin-bottom:5px}
.bubble li::marker{color:var(--accent-2)}
.bubble code{font-family:var(--font-mono);font-size:13px;padding:2px 6px;border-radius:6px;background:var(--code-bg);border:1px solid var(--border);direction:ltr;display:inline-block}
.msg.user .bubble code{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.2);color:#fff}
.bubble a{color:var(--accent-2);text-decoration:none;border-bottom:1px dashed rgba(24,211,197,.5)}
.msg.user .bubble a{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
.code-block{position:relative;margin:10px 0;border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid var(--border)}
.code-head{display:flex;align-items:center;gap:6px;padding:7px 11px;font-size:11px;font-family:var(--font-mono);color:var(--text-faint);border-bottom:1px solid var(--border);background:var(--bot-bg)}
.code-head .lang{margin-inline-end:auto}
.code-head button{display:flex;align-items:center;gap:5px;font-family:var(--font-ar);font-size:11.5px;color:var(--text-dim);padding:3px 8px;border-radius:7px;transition:background .2s,color .2s}
.code-head button:hover{background:var(--hover);color:var(--text)}
.code-head button svg{width:12px;height:12px}
.code-head button.run{color:var(--accent-2)}
.code-block pre{margin:0;padding:13px;overflow-x:auto;direction:ltr;text-align:left}
.code-block code{background:none;border:0;padding:0;font-size:12.8px;line-height:1.75;display:block;white-space:pre}
.py-out{margin:0;padding:10px 13px;direction:ltr;text-align:left;font-family:var(--font-mono);font-size:12.3px;background:rgba(0,0,0,.25);color:var(--accent-2);border-top:1px dashed var(--border-strong);white-space:pre-wrap;max-height:240px;overflow:auto}
.py-out.err{color:var(--bad)}
.py-out .lbl{display:block;font-family:var(--font-ar);font-size:10.5px;color:var(--text-faint);margin-bottom:4px}

/* بنر الأداة */
.tool-banner{display:flex;align-items:center;gap:9px;margin:0 0 8px;padding:8px 12px;border-radius:12px;font-size:12.5px;color:var(--text-dim);background:var(--bot-bg-2);border:1px dashed var(--border-strong)}
.tool-banner .emo{font-size:15px}
.tool-banner .pill{margin-inline-start:auto;font-size:10.5px;padding:2px 9px;border-radius:99px;background:rgba(245,158,11,.14);color:var(--warn);white-space:nowrap}
.tool-banner.done .pill{background:rgba(34,197,94,.14);color:var(--ok)}
.tool-banner.fail .pill{background:rgba(255,95,109,.14);color:var(--bad)}
.tool-banner .spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--accent-1);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}

/* المصادر */
.sources{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border-strong);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sources .lbl{font-size:11px;color:var(--text-faint)}
.src-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent-2);padding:4px 11px;border-radius:99px;border:1px solid rgba(24,211,197,.3);background:rgba(24,211,197,.07);text-decoration:none;transition:background .2s}
.src-chip:hover{background:rgba(24,211,197,.15)}
.src-chip svg{width:11px;height:11px}
.src-chip .lic{font-size:9.5px;color:var(--text-faint)}

/* الاقتراحات */
.suggs{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 4px}
.sugg{font-size:12.5px;color:var(--text-dim);padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:var(--bot-bg);transition:transform .16s var(--ease),color .18s,border-color .18s}
.sugg:hover{transform:translateY(-2px);color:var(--text);border-color:var(--accent-1)}

/* meta */
.meta{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;color:var(--text-faint);opacity:.75}
.msg.user .meta{flex-direction:row-reverse}
.meta .conf{padding:1px 8px;border-radius:99px;background:var(--bot-bg-2);border:1px solid var(--border)}
.meta .conf.hi{color:var(--ok)}
.meta .conf.mid{color:var(--warn)}
.meta .act{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:var(--text-faint);opacity:0;transition:opacity .2s,background .2s,color .2s}
.msg:hover .meta .act{opacity:1}
.meta .act:hover{background:var(--hover);color:var(--text)}
.meta .act svg{width:14px;height:14px}

/* shimmer */
.bubble.streaming .shimmer{background:linear-gradient(100deg,var(--text-dim) 20%,var(--text) 40%,var(--text-dim) 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.cursor{display:inline-block;width:8px;height:16px;vertical-align:-3px;margin-inline-start:3px;border-radius:2px;background:linear-gradient(180deg,var(--accent-1),var(--accent-2));animation:blink .9s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}

/* thinking */
.thinking{display:flex;align-items:center;gap:10px;padding:15px 17px}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--text-faint);animation:bounce 1.25s var(--ease) infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.think-txt{font-size:12.5px;color:var(--text-faint)}

.scroll-fab{position:absolute;bottom:150px;left:50%;transform:translateX(-50%) translateY(14px);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;z-index:5;background:var(--panel-solid);border:1px solid var(--border-strong);color:var(--text);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease);backdrop-filter:blur(12px)}
.scroll-fab.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.scroll-fab svg{width:18px;height:18px}

/* ---------- composer ---------- */
.composer-wrap{flex:none;padding:10px 16px 16px;background:linear-gradient(to top,var(--bg) 55%,transparent);z-index:6;position:relative}
.composer{max-width:860px;margin:0 auto}
.chips{display:flex;gap:8px;padding:0 2px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;font-size:12.5px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);white-space:nowrap;backdrop-filter:blur(10px);transition:transform .18s var(--ease),color .18s,border-color .18s}
.chip:hover{transform:translateY(-2px);color:var(--text);border-color:var(--accent-1)}
.input-box{display:flex;align-items:flex-end;gap:8px;padding:9px 9px 9px 12px;border-radius:var(--r-lg);background:var(--panel-solid);border:1px solid var(--border);box-shadow:var(--shadow-1);backdrop-filter:blur(20px);transition:border-color .25s,box-shadow .25s}
.input-box:focus-within{border-color:rgba(124,92,255,.55);box-shadow:var(--glow)}
textarea#input{flex:1;border:0;outline:0;background:none;resize:none;font-size:15px;line-height:1.85;max-height:190px;min-height:30px;padding:5px 2px;color:var(--text)}
textarea#input::placeholder{color:var(--text-faint)}
.act-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text-faint);transition:background .2s,color .2s}
.act-btn:hover{background:var(--hover);color:var(--text)}
.act-btn svg{width:19px;height:19px}
.send{width:44px;height:44px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff;background:var(--user-grad);box-shadow:0 8px 22px -8px rgba(109,75,255,.85);transition:transform .2s var(--ease),opacity .2s,filter .2s}
.send:hover:not(:disabled){transform:translateY(-2px) scale(1.03)}
.send:active:not(:disabled){transform:scale(.95)}
.send:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.send svg{width:20px;height:20px}
.hint{display:flex;justify-content:space-between;gap:10px;padding:8px 6px 0;font-size:11px;color:var(--text-faint)}
.hint kbd{font-family:var(--font-mono);font-size:10.5px;padding:1px 5px;border-radius:5px;border:1px solid var(--border);background:var(--bot-bg)}
@media (max-width:560px){.hint .kb{display:none}.composer-wrap{padding:8px 10px 12px}}

/* ---------- modal ---------- */
.modal-scrim{position:fixed;inset:0;background:rgba(4,7,12,.6);backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;padding:18px}
.modal-scrim.show{display:flex;animation:fadein .25s var(--ease)}
@keyframes fadein{from{opacity:0}}
.modal{width:100%;max-width:560px;max-height:84dvh;overflow-y:auto;background:var(--panel-solid);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-2);animation:rise .35s var(--ease)}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel-solid);z-index:2}
.modal-head b{font-size:16.5px}
.modal-head .icon-btn{margin-inline-start:auto;width:32px;height:32px}
.modal-head .icon-btn svg{width:16px;height:16px}
.modal-body{padding:18px 20px 22px}
.set-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px dashed var(--border)}
.set-row:last-child{border-bottom:0}
.set-row .info{flex:1;min-width:0}
.set-row .info b{display:block;font-size:14px;margin-bottom:2px}
.set-row .info span{display:block;font-size:12px;color:var(--text-faint);line-height:1.7}
.switch{position:relative;width:44px;height:24px;flex:none;border-radius:99px;background:var(--bot-bg-2);border:1px solid var(--border-strong);transition:background .25s}
.switch::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:var(--text-faint);transition:transform .25s var(--ease),background .25s}
.switch.on{background:rgba(124,92,255,.35);border-color:var(--accent-1)}
.switch.on::after{transform:translateX(-20px);background:var(--accent-1)}
html[dir="rtl"] .switch.on::after{transform:translateX(-20px)}
.danger-btn{margin-top:12px;width:100%;padding:11px;border-radius:12px;font-size:13px;font-weight:600;color:var(--bad);border:1px solid rgba(255,95,109,.35);background:rgba(255,95,109,.07);transition:background .2s}
.danger-btn:hover{background:rgba(255,95,109,.15)}
.test-grid{display:flex;flex-direction:column;gap:6px}
.test-row{display:flex;align-items:center;gap:9px;font-size:12.8px;padding:8px 11px;border-radius:10px;background:var(--bot-bg);border:1px solid var(--border)}
.test-row .st{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff}
.test-row .st.ok{background:var(--ok)}
.test-row .st.no{background:var(--bad)}
.test-row .nm{flex:1}
.test-row .inf{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);direction:ltr}
.test-sum{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;margin-bottom:14px;background:linear-gradient(135deg,rgba(124,92,255,.12),rgba(24,211,197,.10));border:1px solid var(--border-strong)}
.test-sum .big{font-size:26px;font-weight:800;background:linear-gradient(100deg,var(--accent-1),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.test-sum span{font-size:12px;color:var(--text-dim)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border:0}
.kv span{color:var(--text-faint)}

/* toasts */
.toasts{position:fixed;bottom:22px;left:22px;display:flex;flex-direction:column;gap:9px;z-index:60}
.toast{display:flex;align-items:center;gap:9px;padding:11px 15px;border-radius:13px;font-size:13px;background:var(--panel-solid);border:1px solid var(--border-strong);box-shadow:var(--shadow-2);animation:rise .3s var(--ease) both}
.toast svg{width:15px;height:15px;color:var(--ok)}
.toast.warn svg{color:var(--warn)}

/* scrollbars */
.chat-scroll::-webkit-scrollbar,.sessions::-webkit-scrollbar,.code-block pre::-webkit-scrollbar,.modal::-webkit-scrollbar{width:9px;height:9px}
.chat-scroll::-webkit-scrollbar-thumb,.sessions::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.scrim{display:none}

/* ---------- موبايل ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:282px;z-index:30;transform:translateX(102%);box-shadow:var(--shadow-2)}
  html[dir="rtl"] .sidebar{transform:translateX(102%)}
  .sidebar.open{transform:translateX(0)!important}
  .menu-btn{display:grid}
  .scrim{display:block;position:fixed;inset:0;background:rgba(4,7,12,.55);backdrop-filter:blur(3px);z-index:29;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
  .scrim.show{opacity:1;pointer-events:auto}
  .body{max-width:88%}
  .scroll-fab{bottom:168px}
}
@media (max-width:420px){
  .messages{padding:16px 0 20px}
  .chat-scroll{padding:0 10px}
  .bubble{font-size:14.5px;padding:12px 13px}
  .av{width:32px;height:32px;border-radius:10px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.05s!important}}

const STOP_WORDS = new Set(('من في على عن الي الى انا انت انتي هو هي هم هل ما ماذا كيف لماذا متى اين هذا هذه ذلك تلك التي الذي كان كانت كنت يكون تكون مع كل بعض حتى لكن ثم او و لا لم لن قد يا اي ايه يعني ممكن خلاص عند عندي ليه ازاي اقول قول لي اخبار جديد حاجه شويه دايمًا ابدا عنه عنها به بها لي لك له لها نفس شيء شئ اريد عايز محتاج اذا لو يبقي تمام الحقيقه صراحه كمان برضو عني مني لولا هوية اريد من فضلك لو سمحت ممكن تنفع تساعد ساعدني').split(/\s+/));

const PREFIXES = ['وال', 'بال', 'كال', 'فال', 'لل', 'ال', 'و', 'ف', 'ب', 'ك', 'ل'];
const SUFFIXES = ['يات', 'هم', 'هن', 'ها', 'ية', 'يه', 'ات', 'ون', 'ين', 'وا', 'نا', 'كم'];

function latinDigits(s) {
  return String(s)
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));
}

function normalize(s) {
  let t = latinDigits(String(s == null ? '' : s)).toLowerCase();
  t = t.replace(/[\u064B-\u0652\u0670\u0640\u06D6-\u06ED\uFE70-\uFEFF]/g, '');
  t = t.replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
       .replace(/\u0649/g, '\u064A')
       .replace(/\u0624/g, '\u0648')
       .replace(/\u0626/g, '\u064A')
       .replace(/\u0629/g, '\u0647');
  t = t.replace(/[_*#`~\[\]{}|]/g, ' ');
  return t.replace(/\s+/g, ' ').trim();
}

function stem(w) {
  let s = String(w || '');
  if (s.length <= 3) return s;
  let changed = true, guard = 0;
  while (changed && guard++ < 3) {
    changed = false;
    for (const p of PREFIXES) {
      if (s.length - p.length >= 3 && s.indexOf(p) === 0) { s = s.slice(p.length); changed = true; break; }
    }
  }
  for (const sf of SUFFIXES) {
    if (s.length - sf.length >= 4 && s.slice(-sf.length) === sf) { s = s.slice(0, -sf.length); break; }
  }
  return s;
}

function grams(s, n) {
  n = n || 3;
  const src = String(s).replace(/[\s\u0640]/g, '');
  const out = new Set();
  if (!src) return out;
  if (src.length <= n) { out.add(src); return out; }
  for (let i = 0; i <= src.length - n; i++) out.add(src.slice(i, i + n));
  return out;
}

function similarity(a, b) {
  const A = typeof a === 'string' ? grams(normalize(a)) : a;
  const B = typeof b === 'string' ? grams(normalize(b)) : b;
  if (!A.size || !B.size) return 0;
  let inter = 0;
  for (const g of A) if (B.has(g)) inter++;
  return inter / (A.size + B.size - inter);
}

function tokenize(text) {
  let s = normalize(text);
  for (const pair of FRANCO_PHRASES) s = s.replace(pair[0], pair[1]);
  s = latinDigits(s);
  const words = s.match(/[\p{L}\p{N}]+/gu) || [];
  const tokens = [], stems = [];
  for (let w of words) {
    if (FRANCO[w]) w = FRANCO[w];
    const canon = EGY[w] || w;
    const clean = normalize(canon);
    if (!clean) continue;
    tokens.push(clean);
    stems.push(stem(clean));
  }
  return { norm: s, tokens: tokens, stems: stems, grams: grams(s) };
}

function hasAny(s, arr) { return arr.some(x => s.indexOf(x) > -1); }
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtNum(v) {
  if (!isFinite(v)) return String(v);
  const r = Math.round(v * 1e10) / 1e10;
  return r.toLocaleString('en-US', { maximumFractionDigits: 10 });
}
function truncate(s, n) {
  const t = String(s || '').trim();
  return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;
}

/* =========================================================================
 * رقيم 2.0 — الجزء 2: الحساب والوحدات (بدون eval وبدون Function)
 * محلّل تعابير آمن + مسائل كلامية + تحويل وحدات
 * ========================================================================= */

const FN_ALIASES = {
  'جذر': 'sqrt', 'الجذر': 'sqrt', 'جيب': 'sin', 'جتا': 'cos', 'ظل': 'tan',
  'مطلق': 'abs', 'لوغاريتم': 'log', 'لوج': 'log', 'لن': 'ln',
  'اس': 'pow', 'باي': 'pi', 'الاس': 'pow'
};
const FN = {
  sqrt: a => Math.sqrt(a), abs: a => Math.abs(a),
  sin: a => Math.sin(a), cos: a => Math.cos(a), tan: a => Math.tan(a),
  asin: a => Math.asin(a), acos: a => Math.acos(a), atan: a => Math.atan(a),
  log: a => Math.log10(a), ln: a => Math.log(a), log2: a => Math.log2(a),
  exp: a => Math.exp(a), expm1: a => Math.expm1(a),
  floor: a => Math.floor(a), ceil: a => Math.ceil(a), round: a => Math.round(a),
  trunc: a => Math.trunc(a), sign: a => Math.sign(a), cbrt: a => Math.cbrt(a),
  pow: (a, b) => Math.pow(a, b),
  min: (...a) => Math.min(...a), max: (...a) => Math.max(...a),
  sum: (...a) => a.reduce((x, y) => x + y, 0),
  avg: (...a) => a.reduce((x, y) => x + y, 0) / a.length,
  gcd: (a, b) => { a = Math.abs(Math.trunc(a)); b = Math.abs(Math.trunc(b)); while (b) { const t = b; b = a % b; a = t; } return a; },
  fact: a => { if (a < 0 || a > 170 || Math.floor(a) !== a) throw new Error('المضروب لازم عدد صحيح بين 0 و170'); let r = 1; for (let i = 2; i <= a; i++) r *= i; return r; }
};
const CONST = { pi: Math.PI, e: Math.E, tau: Math.PI * 2, phi: (1 + Math.sqrt(5)) / 2 };

function fnName(name) {
  const n = normalize(name);
  return FN_ALIASES[name] || FN_ALIASES[n] || n;
}

function lexMath(src) {
  const s = String(src)
    .replace(/\*\*/g, '^').replace(/[×✕✖]/g, '*').replace(/÷/g, '/')
    .replace(/[−–—]/g, '-').replace(/[،]/g, ',');
  const out = [];
  let i = 0;
  while (i < s.length) {
    const c = s.charAt(i);
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) {
      const m = s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);
      if (!m) throw new Error('رقم غير صالح');
      out.push({ t: 'num', v: parseFloat(m[0]) });
      i += m[0].length;
      continue;
    }
    if (/[\p{L}_]/u.test(c)) {
      const m = s.slice(i).match(/^[\p{L}_][\p{L}\p{N}_]*/u);
      if (!m) throw new Error('اسم غير صالح');
      out.push({ t: 'id', v: m[0] });
      i += m[0].length;
      continue;
    }
    if ('+-*/^%'.indexOf(c) > -1) { out.push({ t: 'op', v: c }); i++; continue; }
    if (c === '(' || c === ')') { out.push({ t: c, v: c }); i++; continue; }
    if (c === ',') { out.push({ t: ',', v: ',' }); i++; continue; }
    throw new Error('رمز غير مسموح: ' + c);
  }
  /* الضرب الضمني: 2(3+4) / 3pi / (2)(5) */
  for (let k = 0; k < out.length - 1; k++) {
    const a = out[k], b = out[k + 1];
    if (a.t === 'op' || a.t === '(' || a.t === ',' || b.t === 'op' || b.t === ')' || b.t === ',' || b.t === 'end') continue;
    if (a.t === 'id' && b.t === '(' && (FN[fnName(a.v)] || CONST[fnName(a.v)] !== undefined)) continue;
    out.splice(k + 1, 0, { t: 'op', v: '*' });
  }
  out.push({ t: 'end', v: 'end' });
  return out;
}

function evaluate(expr) {
  if (String(expr).length > 220) throw new Error('التعبير طويل جدًا');
  const tk = lexMath(expr);
  let i = 0, depth = 0;
  const peek = () => tk[i] || { t: 'end' };
  const isOp = v => peek().t === 'op' && peek().v === v;
  const guard = () => { if (++depth > 40) throw new Error('التعبير عميق جدًا'); };

  function primary() {
    const t = peek();
    if (t.t === 'num') { i++; return t.v; }
    if (t.t === '(') {
      i++; guard();
      const v = expression();
      if (peek().t !== ')') throw new Error('قوس غير مقفول');
      i++; depth--;
      return v;
    }
    if (t.t === 'id') {
      i++;
      const name = fnName(t.v);
      if (CONST[name] !== undefined) return CONST[name];
      if (FN[name]) {
        if (peek().t !== '(') throw new Error('استخدم الأقواس بعد ' + t.v);
        i++; guard();
        const args = [];
        if (peek().t !== ')') {
          args.push(expression());
          while (peek().t === ',') { i++; args.push(expression()); }
        }
        if (peek().t !== ')') throw new Error('قوس غير مقفول في الدالة');
        i++; depth--;
        if (args.some(a => typeof a !== 'number' || !isFinite(a))) throw new Error('مدخلات الدالة غير صالحة');
        return FN[name](...args);
      }
      throw new Error('كلمة غير معروفة: ' + t.v);
    }
    throw new Error('تعبير ناقص أو رمز في غير مكانه');
  }
  function power() {
    let v = primary();
    if (isOp('^')) { i++; const e = unary(); v = Math.pow(v, e); }
    return v;
  }
  function unary() {
    if (isOp('-') || isOp('+')) { const s = peek().v; i++; const v = unary(); return s === '-' ? -v : v; }
    return power();
  }
  function term() {
    let v = unary();
    while (peek().t === 'op' && ['*', '/', '%'].indexOf(peek().v) > -1) {
      const op = peek().v; i++;
      const b = unary();
      if ((op === '/' || op === '%') && b === 0) throw new Error('القسمة على صفر');
      v = op === '*' ? v * b : (op === '/' ? v / b : v % b);
    }
    return v;
  }
  function expression() {
    let v = term();
    while (peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
      const op = peek().v; i++;
      const b = term();
      v = op === '+' ? v + b : v - b;
    }
    return v;
  }
  const value = expression();
  if (peek().t !== 'end') throw new Error('رموز زائدة في نهاية التعبير');
  if (typeof value !== 'number' || !isFinite(value)) throw new Error('النتيجة غير عددية');
  return value;
}

/* استخراج تعبير رياضي من جملة عربية — يرفض أي كلام غير رياضي */
const MATH_ALLOWED_IDS = new Set(Object.keys(FN).concat(Object.keys(CONST), Object.keys(FN_ALIASES)));
function extractExpression(raw) {
  let s = latinDigits(String(raw || ''));
  if (s.length > 240) return null;
  const parts = s.match(/[A-Za-z_]+|[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+|(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[+\-*/^%(),]/g) || [];
  const kept = [];
  for (const p of parts) {
    if (/^[A-Za-z_]+$/.test(p)) {
      const n = normalize(p);
      if (MATH_ALLOWED_IDS.has(n)) kept.push(n);
      else if (MATH_ALLOWED_IDS.has(fnName(p))) kept.push(fnName(p));
      else continue;
    } else if (/^[\u0600-\u06FF]/.test(p)) {
      /* كلمة عربية: تُقبل فقط إذا كانت اسم دالة معروف بالكامل */
      if (FN_ALIASES[p]) kept.push(FN_ALIASES[p]);
      else continue;
    } else kept.push(p);
  }
  const expr = kept.join(' ').trim();
  if (!/[0-9]/.test(expr)) return null;
  if (!/[+\-*/^%]/.test(expr)) return null;
  if (expr.length > 180) return null;
  return expr;
}

function solveMath(text) {
  const expr = extractExpression(text);
  if (!expr) return null;
  try { return { ok: true, expr: expr, value: evaluate(expr) }; }
  catch (e) { return { ok: false, expr: expr, error: e.message }; }
}

/* مسائل كلامية مصرية بسيطة */
function wordProblem(raw) {
  const s = latinDigits(normalize(raw));
  const num = '(\\d+(?:\\.\\d+)?)';
  let m;

  m = s.match(new RegExp('(^|[^\\d.])' + num + '\\s*%?\\s*(?:زياده|زيادة|ارتفع|زاد|زود)\\s*(?:على|علي|من|ل)?\\s*' + num)) ||
      s.match(new RegExp('(?:زياده|زيادة|ارتفع|زاد|زود)\\s*' + num + '\\s*%?\\s*(?:على|علي|من|ل)?\\s*' + num));
  if (m) {
    let p, a;
    if (/^(?:زياده|زيادة|ارتفع|زاد|زود)/.test(m[0])) { p = +m[1]; a = +m[2]; }
    else { p = +m[2]; a = +m[3]; }
    if (p >= 0 && p <= 100) {
      const v = a * (1 + p / 100);
      return { ok: true, kind: 'increase', value: v, expr: a + ' + ' + p + '%',
        explain: 'الزيادة = ' + fmtNum(a * p / 100) + '، والقيمة الجديدة = ' + fmtNum(v) + '.' };
    }
  }
  m = s.match(new RegExp('(^|[^\\d.])' + num + '\\s*%\\s*(?:من|min|of)\\s*' + num));
  if (m) {
    const p = +m[2], a = +m[3], v = a * p / 100;
    return { ok: true, kind: 'percent-of', value: v, expr: p + '% × ' + a,
      explain: p + '% من ' + fmtNum(a) + ' = ' + fmtNum(v) + ' — القاعدة: اضرب في النسبة واقسم على 100.' };
  }
  /* خصم: «500 وخصم 20» أو «خصم 20% على 500» */
  let dm = s.match(new RegExp('(^|[^\\d.])' + num + '\\s*(?:و|مع|ب)?\\s*(?:نزل|عمل|خد)?\\s*(?:خصم|تخفيض)\\s*' + num + '\\s*%?'));
  let amount = 0, percent = 0;
  if (dm) { amount = +dm[2]; percent = +dm[3]; }
  else {
    dm = s.match(new RegExp('(?:خصم|تخفيض)\\s*' + num + '\\s*(?:%\\s*(?:على|علي|من|ل)?|(?:على|علي|من|ل))\\s*' + num));
    if (dm) { percent = +dm[1]; amount = +dm[2]; }
  }
  if (dm && percent >= 0 && percent <= 100) {
    const discount = amount * percent / 100;
    return { ok: true, kind: 'discount', value: amount - discount, expr: amount + ' - ' + percent + '%',
      explain: 'الخصم = ' + fmtNum(discount) + '، والسعر بعد الخصم = ' + fmtNum(amount - discount) + '.' };
  }
  m = s.match(new RegExp('(?:نسبه|نسبة|ما نسبه)\\s*' + num + '\\s*(?:من|الى|إلى|ل)\\s*' + num));
  if (m) {
    const a = +m[1], b = +m[2];
    if (b === 0) return { ok: false, error: 'المقام صفر' };
    return { ok: true, kind: 'ratio', value: a / b * 100, expr: a + ' / ' + b + ' × 100',
      explain: fmtNum(a) + ' من ' + fmtNum(b) + ' = ' + fmtNum(a / b * 100) + '%.' };
  }
  if (/(?:متوسط|average|mean)/.test(s)) {
    const nums = (s.match(/\d+(?:\.\d+)?/g) || []).map(Number);
    if (nums.length >= 2) {
      const v = nums.reduce((a, b) => a + b, 0) / nums.length;
      return { ok: true, kind: 'average', value: v, expr: 'avg(' + nums.join(', ') + ')',
        explain: 'المجموع = ' + fmtNum(nums.reduce((a, b) => a + b, 0)) + '، وعدد القيم = ' + nums.length + '، فالمتوسط = ' + fmtNum(v) + '.' };
    }
  }
  m = s.match(new RegExp('(?:مساحه|مساحة).{0,18}(?:دايره|دائرة|قرص).{0,18}' + num));
  if (m) {
    const r = +m[1], v = Math.PI * r * r;
    return { ok: true, kind: 'circle', value: v, expr: 'π × ' + r + '²',
      explain: 'مساحة الدائرة = π × نق² = ' + fmtNum(v) + ' وحدة مربعة.' };
  }
  return null;
}

  { cat: 'temp', special: 'c', names: ['c', '°c', 'س', 'سلسيوس', 'مئوية', 'celsius'] },
  { cat: 'temp', special: 'f', names: ['f', '°f', 'ف', 'فهرنهايت', 'fahrenheit'] },
  { cat: 'temp', special: 'k', names: ['k', 'ك', 'كلفن', 'kelvin'] }
];
const UNIT_MAP = {};
for (const d of UNIT_DEFS) for (const n of d.names) {
  UNIT_MAP[normalize(n)] = d;
  const ns = normalize(n).replace(/\s+/g, '');
  if (!UNIT_MAP[ns]) UNIT_MAP[ns] = d;
}
/* مفاتيح حساسة حالة الأحرف للبايت/بت */
UNIT_MAP['B'] = UNIT_DEFS.find(d => d.k === 8 && d.cat === 'data');
UNIT_MAP['b'] = UNIT_DEFS.find(d => d.k === 1 && d.cat === 'data');

function lookupUnit(word) {
  if (!word) return null;
  const w = String(word).trim().replace(/[؟?.,،؛;]$/, '');
  return UNIT_MAP[w] || UNIT_MAP[normalize(w)] || null;
}

function convertValue(value, from, to) {
  if (from.cat !== to.cat) return null;
  if (from.cat === 'temp') {
    const c = from.special === 'c' ? value : (from.special === 'f' ? (value - 32) * 5 / 9 : value - 273.15);
    return to.special === 'c' ? c : (to.special === 'f' ? c * 9 / 5 + 32 : c + 273.15);
  }
  return value * from.k / to.k;
}

function lookupUnitPhrase(phrase) {
  let p = String(phrase || '').trim().replace(/^[،,\s]+|[،,؟?.;\s]+$/g, '');
  let d = lookupUnit(p);
  if (d) return d;
  d = UNIT_MAP[normalize(p).replace(/\s+/g, '')];
  if (d) return d;
  const words = normalize(p).split(/\s+/).filter(w => w && !STOP_WORDS.has(w));
  for (let i = words.length - 1; i >= 0; i--) { d = lookupUnit(words[i]); if (d) return d; }
  return null;
}

function convertUnits(raw) {
  const s = latinDigits(String(raw || '')).trim();
  /* التمريرة 1: فواصل صريحة (الى / to / in / = ...) */
  let m = s.match(/([\d.]+)\s*([^\d]+?)\s*(?:الى|إلى|لـ|to|in|→|=>|=)\s*(.+)$/iu);
  if (m) {
    const value = parseFloat(m[1]);
    const from = lookupUnitPhrase(m[2]);
    const to = lookupUnitPhrase(m[3]);
    if (isFinite(value) && from && to) {
      const result = convertValue(value, from, to);
      if (result !== null) {
        return { ok: true, value: result, from: m[2].trim(), to: m[3].trim(), cat: to.cat,
          expr: value + ' ' + m[2].trim() + ' ← ' + m[3].trim() };
      }
      return { ok: false, error: 'الوحدتان من نوعين مختلفين' };
    }
  }
  /* التمريرة 2: «ل» الملتصقة بوحدة بعد مسافة: 5 كيلومتر لمتر */
  m = s.match(/([\d.]+)\s*([^\d]+?)\s+ل\s*(.+)$/u);
  if (m) {
    const value = parseFloat(m[1]);
    const from = lookupUnitPhrase(m[2]);
    const to = lookupUnitPhrase(m[3]);
    if (isFinite(value) && from && to) {
      const result = convertValue(value, from, to);
      if (result !== null) {
        return { ok: true, value: result, from: m[2].trim(), to: m[3].trim(), cat: to.cat,
          expr: value + ' ' + m[2].trim() + ' ← ' + m[3].trim() };
      }
      return { ok: false, error: 'الوحدتان من نوعين مختلفين' };
    }
  }
  return null;
}

function formatMath(res, source) {
  if (!res) return null;
  if (!res.ok) {
    return 'حاولت أحسبها، لكن **' + esc(res.error || 'التعبير غير مفهوم') + '**.\n\n' +
      'اكتبها بشكل أوضح، مثل: `٢ + ٢` أو `sqrt(144)` أو `500 وخصم 20%` أو `10 km to m`.';
  }
  const head = source === 'word' ? '**' + esc(res.explain) + '**' : '**النتيجة: ' + fmtNum(res.value) + '**';
  const tail = source === 'word'
    ? '\n\nالتعبير اللي استخدمته: `' + esc(res.expr || '') + '`.'
    : '\n\n`' + esc(res.expr) + ' = ' + fmtNum(res.value) + '`';
  const note = rnd([
    'الحساب هنا بمحلّل رياضي مكتوب داخل الصفحة — مش تخمين ولا كود خطير.',
    'ودا من الأماكن اللي أقدر أقول فيها «100% صح» بضمير مرتاح.',
    'لو احتجت خطوات أطول، قولي «اشرح الخطوات» وأنا أفككها.'
  ]);
  return head + tail + '\n\n' + note;
}

 * رقيم 2.0 — الجزء 3: الوقت والتاريخ (ميلادي / هجري) + رموز الطقس

function intlOrNull(locale, opts, date) {
  try { return new Intl.DateTimeFormat(locale, opts).format(date); } catch (e) { return null; }
}

function hijriText(now) {
  const tries = ['ar-EG-u-ca-islamic-umalqura-nu-latn', 'ar-EG-u-ca-islamic-civil-nu-latn', 'ar-SA-u-ca-islamic-umalqura-nu-latn'];
  for (const loc of tries) {
    const v = intlOrNull(loc, { day: 'numeric', month: 'long', year: 'numeric' }, now);
    if (v) return v;
  }
  return null;
}

function dateInfo(raw, now) {
  now = now instanceof Date ? now : new Date();
  const n = normalize(raw || '');
  const wantsHijri = /(هجري|هجريه|هجريه|اسلامي|الهجري|بالهجري)/.test(n);
  const wantsTomorrow = /(بكره|بكرة|غدا|غداً|بكرا|الغد)/.test(n);
  const wantsDate = /(تاريخ|اليوم|النهارده|النهاردة|date|السنة|الشهر)/.test(n);
  const wantsTime = /(ساعه|الساعة|الوقت|الان|time|الساعه كام)/.test(n);
  const d = wantsTomorrow ? new Date(now.getTime() + 86400000) : now;
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })();

  if (wantsHijri) {
    const h = hijriText(d);
    if (h) {
      return { kind: 'hijri', text: 'التاريخ الهجري ' + (wantsTomorrow ? 'غدًا ' : 'اليوم ') + '**' + h + ' هـ**' +
        (tz ? ' — حسب تقويم أم القرى في نطاق `' + tz + '`.' : '.') +
        '\n\nملاحظة صادقة: التقويم الهجري هنا محسوب بخوارزمية `Intl` المدمجة في المتصفح، وقد يختلف عن الرؤية الشرعية بيوم — راجع الجهة المختصة في أمور الدين.' };
    }
    return { kind: 'hijri', text: 'المتصفح عندك لا يدعم التقويم الهجري عبر `Intl` — مش هألف لك تاريخ. جرّب متصفح حديث (Chrome / Firefox / Safari).' };
  }

  if (wantsDate || (!wantsTime && /التاريخ/.test(n))) {
    const full = intlOrNull('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }, d) || d.toDateString();
    const h = hijriText(d);
    return { kind: 'date', text: 'التاريخ ' + (wantsTomorrow ? 'غدًا: ' : 'اليوم: ') + '**' + full + '**' +
      (h ? '\n\nوبالهجري: **' + h + ' هـ**' : '') +
      (tz ? '\n\nالمنطقة الزمنية لجهازك: `' + tz + '`' : '') };
  }

  const t = intlOrNull('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }, now) || now.toLocaleTimeString();
  const full = intlOrNull('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }, now) || '';
  return { kind: 'time', text: 'الساعة عندك الآن **' + t + '**' +
    (full ? '\n\nوالتاريخ: ' + full : '') +
    (tz ? ' — `' + tz + '`' : '') +
    '\n\nالساعة من جهازك، مش من سيرفر عندي؛ لو جهازك غلط، هقولك غلط بثقة. ظبط الوقت لديك.' };
}

 * رقيم 2.0 — الجزء 5: الاسترجاع الهجين (BM25 + بصمات حروف + تطابق عبارات)
 * ========================================================================= */
function setSimilarity(A, B) {
  if (!A.size || !B.size) return 0;
  let inter = 0;
  for (const g of A) if (B.has(g)) inter++;
  return inter / (A.size + B.size - inter);
}

const INDEX = (function build() {
  const docs = [];
  const df = new Map();
  for (let i = 0; i < KB.length; i++) {
    const e = KB[i];
    const qTok = tokenize([e.title, e.tags, e.q.join(' ')].join(' '));
    const aTok = tokenize(truncate(e.a.join(' '), 420));
    const counts = new Map();
    for (const w of qTok.stems) counts.set(w, (counts.get(w) || 0) + 3);
    for (const w of aTok.stems) counts.set(w, (counts.get(w) || 0) + 1);
    const qGrams = e.q.map(q => grams(normalize(q)));
    qGrams.push(grams(normalize(e.title + ' ' + e.tags)));
    docs.push({ i: i, e: e, len: qTok.stems.length * 3 + aTok.stems.length, counts: counts, qGrams: qGrams });
    for (const w of counts.keys()) df.set(w, (df.get(w) || 0) + 1);
  }
  const N = docs.length || 1;
  const avgdl = docs.reduce((s, d) => s + d.len, 0) / N;
  const idfCache = new Map();
  function idf(w) {
    if (idfCache.has(w)) return idfCache.get(w);
    const n = df.get(w) || 0;
    const v = Math.log(1 + (N - n + 0.5) / (n + 0.5));
    idfCache.set(w, v);
    return v;
  }
  return { docs: docs, N: N, avgdl: avgdl, idf: idf };
})();

const CONF_THRESHOLD = 0.42;

function retrieve(query, opts) {
  opts = opts || {};
  const t = tokenize(query);
  const nq = normalize(query);
  const terms = Array.from(new Set(t.stems.concat(t.tokens))).filter(w => w && w.length > 1);
  const k1 = 1.35, b = 0.62;
  const out = [];

  for (const d of INDEX.docs) {
    let raw = 0;
    for (const w of terms) {
      const tf = d.counts.get(w) || 0;
      if (!tf) continue;
      raw += INDEX.idf(w) * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * (d.len / (INDEX.avgdl || 1))));
    }
    let sim = 0;
    for (const g of d.qGrams) { const v = setSimilarity(t.grams, g); if (v > sim) sim = v; }
    let phrase = 0;
    for (const q of d.e.q) {
      const n = normalize(q);
      if (nq === n) { phrase = 1; break; }
      if (nq.length >= 5 && n.indexOf(nq) > -1) phrase = Math.max(phrase, 0.88);
      else if (n.length >= 5 && nq.indexOf(n) > -1) phrase = Math.max(phrase, 0.74);
    }
    const bmNorm = 1 - Math.exp(-raw / 2.6);
    let conf = 0.58 * bmNorm + 0.24 * phrase + 0.18 * sim;
    if (opts.intent && d.e.intent === opts.intent) conf += 0.06;
    if (opts.intent && d.e.intent !== opts.intent && opts.intent !== 'general') conf -= 0.025;
    conf = clamp(conf, 0, 0.99);
    out.push({ entry: d.e, raw: raw, sim: sim, phrase: phrase, confidence: conf });
  }
  out.sort((a, b) => b.confidence - a.confidence || b.raw - a.raw);
  return out;
}

function detectCity(raw, state) {
  const n = normalize(raw);
  const keys = Object.keys(CITIES).sort((a, b) => b.length - a.length);
  for (const k of keys) {
    const nk = normalize(k);
    if (n === nk || n.indexOf(' ' + nk + ' ') > -1 || n.indexOf(' ' + nk) > -1 || n.indexOf(nk + ' ') > -1 || n.indexOf('في ' + nk) > -1) {
      return { name: k, query: CITIES[k] };
    }
  }
  /* استخراج حر بعد حرف الجر */
  const m = n.match(/(?:في|فى|بمدينه|بمدينة|مدينه|مدينة|بـ|ب)\s+([\u0600-\u06FFa-z ]{2,24})/);
  if (m) {
    let c = m[1].trim().replace(/(الان|دلوقتي|النهارده|بكره|غدا|الطقس|الجو|كام|ازاي|عامل ايه|؟|\?)+$/g, '').trim();
    c = c.replace(/\s+/g, ' ').split(' ').slice(0, 3).join(' ').trim();
    if (c.length >= 2) return { name: c, query: c };
  }
  if (state && state.slots && state.slots.city) return state.slots.city;
  return null;
}

function detectEntity(raw) {
  let s = normalize(raw)
    .replace(/^(من هو|مين هو|مين|ما هو|ما هي|ما هو|عرفني على|عرفني عن|معلومات عن|معلومه عن|ابحث عن|ابحثلي عن|دور على|بحث عن|ويكيبيديا|من هو مؤسس|مؤسس|تاريخ|قول لي عن)\s*/, '')
    .replace(/(من فضلك|لو سمحت|ممكن|عايز اعرف|اريد ان اعرف)\s*/g, '')
    .replace(/[؟?!.،؛;]+$/g, '')
    .trim();
  s = s.split(/\s+/).slice(0, 8).join(' ').trim();
  return s.length >= 2 ? s : '';
}

function detectName(raw) {
  const m = String(raw).match(/(?:اسمي|اسمى|انا اسمي|انا اسمي هو|اسمي هو|my name is|call me)\s+([\p{L}]{2,16})/iu);
  if (!m) return null;
  const nm = m[1].trim();
  if (STOP_WORDS.has(normalize(nm)) || /^(رقيم|بوت|مساعد)$/.test(normalize(nm))) return null;
  return nm;
}

function createState() {
  return { turn: 0, user: null, lastIntent: null, lastEntity: null, lastTopic: null, lastSources: [], slots: {}, used: new Set(), history: [] };
}

function resolveAnaphora(state, raw) {
  const n = normalize(raw);
  const short = n.length <= 42;
  if (short && state && state.slots && state.slots.city && /(بكره|بكرة|غدا|النهارده|اليوم|الساعه كام|دلوقتي|الان)/.test(n) && !/(طقس|جو|حراره)/.test(n)) {
    const when = /(بكره|بكرة|غدا)/.test(n) ? 'غدا' : 'الان';
    const c = state.slots.city;
    return { text: 'الطقس ' + when + ' في ' + c.name, resolved: true, note: 'city' };
  }
  if (short && state && state.lastEntity && /(عاصمتها|سكانها|تاريخها|مؤسسها|لغتها|عملتها|مساحتها|ازاي اتسمت|مين اسسها)/.test(n)) {
    return { text: n.replace(/ها\b/g, '') + ' ' + state.lastEntity, resolved: true, note: 'entity' };
  }
  return { text: raw, resolved: false, note: null };
}

function route(raw, state) {
  const resolved = resolveAnaphora(state || createState(), raw);
  const text = resolved.text;
  const n = normalize(text);
  const slots = {};
  const base = { original: raw, text: text, n: n, slots: slots, resolved: resolved.resolved, intent: 'general' };

  /* 1) الاسم */
  const nm = detectName(text);
  if (nm) { base.intent = 'name'; slots.name = nm; return base; }

  /* 2) الطقس */
  if (/(طقس|جو|حراره|درجه الحراره|هتمطر|هينزل مطر|weather|forecast)/.test(n)) {
    const city = detectCity(text, state);
    slots.when = /(بكره|بكرة|غدا|الغد|tomorrow)/.test(n) ? 'tomorrow' : 'now';
    if (city) { slots.city = city; base.intent = 'weather'; return base; }
    base.intent = 'weather';
    base.needsClarification = 'city';
    return base;
  }

  /* 3) الوقت والتاريخ */
  const timeHit = /(الساعه|الساعة|كم الساعه|التاريخ|هجري|النهارده|النهاردة|اليوم|بكره|غدا|what time|date)/.test(n);
  const timeBlocked = /(اداره|ادارة|تنظيم|تسويف|انتاجيه|ضياع|مذاكره|امتحان)/.test(n);
  if (timeHit && !timeBlocked && n.length <= 60) { base.intent = 'time'; return base; }

  /* 4) الوحدات */
  const conv = convertUnits(text);
  if (conv) { base.intent = 'units'; slots.conversion = conv; return base; }

  /* 5) الحساب */
  const wp = wordProblem(text);
  if (wp) { base.intent = 'math'; slots.math = wp; slots.mathSource = 'word'; return base; }
  if (!/(تاريخ|هجري|الساعه|الساعة)/.test(n)) {
    const m = solveMath(text);
    if (m) { base.intent = 'math'; slots.math = m; slots.mathSource = 'expr'; return base; }
  }

  /* 6) معلومات/كيان (مرشّح للأداة، والاسترجاع له الأولوية) */
  const factHit = /(من هو|مين هو|مين|ما هو|ما هي|عرفني|معلومات عن|معلومه عن|ابحث عن|ابحثلي|دور على|بحث عن|ويكيبيديا|تاسس|تأسس|اخترع|اكتشف|عاصمه|عاصمة|عدد سكان|سكان|متى ولد|من مؤسس|مؤسس)/.test(n);
  if (factHit) {
    base.intent = 'fact';
    slots.entity = detectEntity(text);
    return base;
  }

  /* 7) كود */
  if (/(كود|code|داله|دالة|فنكشن|function|snippet|debounce|استعلام|query)/.test(n)) {
    base.intent = 'code';
    return base;
  }
  return base;
}

function updateState(state, raw, result) {
  if (!state) return state;
  state.turn = (state.turn || 0) + 1;
  state.lastIntent = result.intent || 'general';
  (state.history = state.history || []).push({ q: truncate(raw, 120), intent: state.lastIntent, conf: result.confidence || 0 });
  if (state.history.length > 30) state.history.shift();
  if (result.slots && result.slots.city) state.slots.city = result.slots.city;
  if (result.slots && result.slots.entity) state.lastEntity = result.slots.entity;
  if (result.sources && result.sources.length) state.lastSources = result.sources;
  if (result.topic) state.lastTopic = result.topic;
  return state;
}

const SNIPPET_LANG = { python_clean: 'python', sql_top: 'sql', css_center: 'css', react_counter: 'jsx' };

function expand(text, state) {
  let out = String(text || '');
  out = out.replace(/\[\[code:([a-zA-Z0-9_]+)\]\]/g, (m, k) =>
    SNIPPETS[k] ? '```' + (SNIPPET_LANG[k] || 'js') + '\n' + SNIPPETS[k] + '\n```' : '');
  const n = state && state.user;
  out = out.replace(/\{name\}/g, n ? ' ' + n : '');
  return out;
}

function pickReply(entry, state) {
  const used = (state && state.used) || new Set();
  let pool = entry.a.filter(a => !used.has(entry.id + '::' + a));
  if (!pool.length) pool = entry.a.slice();
  const chosen = rnd(pool);
  used.add(entry.id + '::' + chosen);
  if (used.size > 140) used.clear();
  return chosen;
}

const STYLE_LINES = [
  'وده رأي، مش فتوى — خُد اللي ينفعك وسيب الباقي.',
  'لو اختلفت معايا، قول لي؛ الاعتراض بيحسّن الجواب.',
  'أنا هنا للتفكير معك، مش بدل ما تفكر.',
  '-hard', 'سؤالك يستحق إجابة أطول، بس الصدق الأول.'
];
function styleLayer(text, intent, confidence) {
  if (['sensitive', 'limitation', 'tool', 'identity'].indexOf(intent) > -1) return text;
  if (confidence < 0.55 || Math.random() > 0.28) return text;
  const lines = STYLE_LINES.filter(x => x !== '-hard');
  return text + '\n\n' + rnd(lines);
}

function uniq(arr) { return arr.filter((v, i) => arr.indexOf(v) === i); }

function unknownReply(query, hits) {
  const qs = uniq(hits.slice(0, 3).map(h => h.entry.q[0])).filter(Boolean);
  const q = truncate(String(query).trim(), 70);
  const lines = qs.length ? '\n\nتقصد حاجة زي:\n' + qs.map(x => '- «' + x + '»').join('\n') : '';
  const text = '**مش متأكد إني فهمت قصدك** من «' + esc(q) + '» — ومش هألف لك إجابة عميقة وأسوّقها كأنها معرفة.\n\n' +
    'دي حدودي، وأنا أفضل أقولها صريحة.' + lines + '\n\nجرّب تعيد صياغة السؤال، أو قولي «ابحث في ويكيبيديا عن ' + esc(truncate(q, 28)) + '».';
  return {
    text: text, mood: 'honest', intent: 'unknown', confidence: hits.length ? hits[0].confidence : 0,
    suggestions: qs.concat(['ابحث في ويكيبيديا عن ' + truncate(q, 24)]),
    actions: [{ type: 'wikipedia', query: q }]

}

function clarificationReply(kind) {

    return {

      intent: 'clarify', mood: 'tool', confidence: 1, needsSlot: 'city',
      suggestions: ['الطقس في الإسكندرية', 'الطقس في القاهرة', 'الطقس في دبي', 'الطقس في لندن', 'الطقس بكرة في الرياض']
    };

}

const OFFLINE_WEATHER = 'ما قدرتش أجيب بيانات الطقس دلوقتي — الشبكة مقفولة أو الخدمة مش متاحة من المتصفح.\n\n**مش هقولك درجة حرارة من عندي.** جرّب تفتح الإعدادات وتسمح بالطلبات الخارجية، أو اسألني تاني لما الإنترنت يرجع.';
const OFFLINE_WIKI = 'ما قدرتش أصل لويكيبيديا دلوقتي (CORS أو الشبكة أو الكلمة مش موجودة).\n\n**مش هألف معلومة.** جرّب كلمة تانية، أو شغّل «الطلبات الخارجية» من الإعدادات، أو افتح الرابط ده في متصفحك: https://ar.wikipedia.org';

function toolLoading(t) {
  return t.type === 'weather'
    ? 'خليني أجيب الطقس من **Open-Meteo**… ثانية واحدة.'
    : 'بدور في **ويكيبيديا** على معلومة موثقة… ثانية واحدة.';
}
function toolFallback(t) { return t.type === 'weather' ? OFFLINE_WEATHER : OFFLINE_WIKI; }

function reply(raw, state) {
  state = state || createState();
  const r = route(raw, state);
  const out = {
    text: '', intent: r.intent, confidence: 0, mood: '', sources: [], suggestions: [],
    actions: [], tool: null, loading: '', fallback: '', needsSlot: null,
    slots: r.slots, resolved: r.resolved, topic: null, meta: { version: VERSION }
  };

  /* اسم المستخدم */
  if (r.intent === 'name') {
    const nm = r.slots.name;
    state.user = nm;
    out.text = 'تشرفت بيك يا **' + esc(nm) + '** — الاسم اتسجّل في الرقيم.\n\nمن دلوقتي هقولك باسمك. إيه اللي جابك النهاردة: سؤال، مشكلة، ولا فضول؟';
    out.mood = 'warm'; out.confidence = 1; out.topic = nm;
    updateState(state, raw, out);
    return out;
  }

  /* طلب توضيح */
  if (r.needsClarification) {
    const c = clarificationReply(r.needsClarification);
    Object.assign(out, c);
    updateState(state, raw, out);
    return out;
  }

  /* الحساب */
  if (r.intent === 'math') {
    out.text = formatMath(r.slots.math, r.slots.mathSource);
    out.intent = 'math'; out.mood = 'tool'; out.confidence = 1;
    out.suggestions = ['500 وخصم 20%', '10 km to m', 'sqrt(144)', 'متوسط 4 و 8 و 10'];
    updateState(state, raw, out);
    return out;
  }

  /* الوحدات */
  if (r.intent === 'units') {
    const c = r.slots.conversion;
    if (!c.ok) {
      out.text = 'الوحدتين دول من نوعين مختلفين — ما ينفعش أحوّل بينهم (' + esc(c.error) + ').\n\nجرّب `10 km to m` أو `100 f to c`.';
    } else {
      out.text = '**' + fmtNum(c.value) + '**\n\n`' + esc(c.expr) + '` = ' + fmtNum(c.value) +
        '\n\nالتحويل بمعاملات ثابتة معروفة، مش تقدير.';
    }
    out.intent = 'units'; out.mood = 'tool'; out.confidence = 1;
    updateState(state, raw, out);
    return out;
  }

  /* الوقت والتاريخ */
  if (r.intent === 'time') {
    const info = dateInfo(r.text);
    out.text = info.text; out.intent = 'time'; out.mood = 'tool'; out.confidence = 1;
    out.meta.kind = info.kind;
    updateState(state, raw, out);
    return out;
  }

  /* الطقس: أداة مباشرة (بيانات حيّة أفضل من أي رد محفوظ) */
  if (r.intent === 'weather' && r.slots.city) {
    out.tool = { type: 'weather', city: r.slots.city, when: r.slots.when || 'now' };
    out.loading = toolLoading(out.tool);
    out.fallback = toolFallback(out.tool);
    out.text = out.fallback;
    out.intent = 'weather'; out.mood = 'tool'; out.confidence = 1;
    out.topic = r.slots.city.name;
    updateState(state, raw, out);
    return out;
  }

  /* الاسترجاع من قاعدة الحوار */
  const hits = retrieve(r.text, { intent: r.intent });
  const best = hits[0];
  const factPrefersTool = r.intent === 'fact' && r.slots.entity &&
    (!best || best.confidence < CONF_THRESHOLD + 0.1 ||
      ['wikipedia-help', 'identity', 'honesty', 'capabilities'].indexOf(best.entry.id) > -1);

  if (factPrefersTool) {
    out.tool = { type: 'wikipedia', query: r.slots.entity, lang: 'ar' };
    out.loading = toolLoading(out.tool);
    out.fallback = toolFallback(out.tool);
    out.text = out.fallback;
    out.intent = 'fact'; out.mood = 'tool'; out.confidence = 0.5;
    out.topic = r.slots.entity;
    updateState(state, raw, out);
    return out;
  }

  if (best && best.confidence >= CONF_THRESHOLD) {
    const e = best.entry;
    out.text = expand(styleLayer(pickReply(e, state), e.intent, best.confidence), state);
    out.intent = e.intent;
    out.confidence = Math.round(best.confidence * 100) / 100;
    out.mood = 'kb';
    out.topic = e.title;
    out.suggestions = hits.slice(1, 3).map(h => h.entry.q[0]);
    out.meta.matched = e.id;
    out.meta.score = Math.round(best.raw * 100) / 100;
    updateState(state, raw, out);
    return out;
  }

  /* باب الثقة: الاعتراف بعدم الفهم */
  const u = unknownReply(r.text, hits);
  Object.assign(out, u);
  updateState(state, raw, out);
  return out;
}

const CACHE = new Map();
let _fetchImpl = null, _persist = null, _networkAllowed = true;

function configure(opts) {
  opts = opts || {};
  if (typeof opts.fetch === 'function') _fetchImpl = opts.fetch;
  if (opts.cache) _persist = opts.cache;
  if (typeof opts.networkAllowed === 'boolean') _networkAllowed = opts.networkAllowed;
  return API;
}
function cacheKey(k) { return 'raqim2:cache:' + k; }
function cacheGet(k, ttl) {
  const now = Date.now();
  let v = CACHE.get(k);
  if (!v && _persist) { try { v = JSON.parse(_persist.getItem(cacheKey(k))); } catch (e) { v = null; } }
  if (v && (now - v.t) < ttl) return v.v;
  return null;
}
function cacheSet(k, val) {
  if (CACHE.size > 80) CACHE.clear();
  CACHE.set(k, { t: Date.now(), v: val });
  if (_persist) { try { _persist.setItem(cacheKey(k), JSON.stringify({ t: Date.now(), v: val })); } catch (e) {} }
}
async function getJSON(url, ms) {
  if (!_networkAllowed) throw new Error('NETWORK_DISABLED');
  const f = _fetchImpl || (typeof fetch === 'function' ? fetch : null);
  if (!f) throw new Error('NO_FETCH');
  let ctrl = null, timer = null;
  try {
    if (typeof AbortController === 'function') {
      ctrl = new AbortController();
      timer = setTimeout(() => ctrl.abort(), ms || 9000);
    }
    const res = await f(url, ctrl ? { signal: ctrl.signal } : undefined);
    if (!res || !res.ok) throw new Error('HTTP_' + (res ? res.status : 'ERR'));
    return await res.json();
  } finally { if (timer) clearTimeout(timer); }
}

function wikiApi(lang, params) {
  return 'https://' + lang + '.wikipedia.org/w/api.php?' + params + '&format=json&origin=*&utf8=1';
}

async function wikiLookup(query, lang) {
  lang = lang || 'ar';
  const search = await getJSON(wikiApi(lang, 'action=query&list=search&srlimit=3&srsearch=' + encodeURIComponent(query)));
  const list = (search && search.query && search.query.search) || [];
  if (!list.length) return null;
  const title = list[0].title;
  const detail = await getJSON(wikiApi(lang,
    'action=query&prop=extracts|info&inprop=url&exintro=1&explaintext=1&redirects=1&titles=' + encodeURIComponent(title)));
  const pages = (detail && detail.query && detail.query.pages) || {};
  const page = Object.keys(pages).map(k => pages[k]).filter(p => p && !p.missing)[0];
  if (!page) return null;
  const extract = truncate(String(page.extract || '').replace(/\s*\n+\s*/g, ' ').replace(/\s{2,}/g, ' '), 950);
  if (!extract) return null;
  const url = page.fullurl || ('https://' + lang + '.wikipedia.org/wiki/' + encodeURIComponent((page.title || title).replace(/ /g, '_')));
  const label = lang === 'ar' ? 'ويكيبيديا العربية' : 'ويكيبيديا الإنجليزية';
  return {
    title: page.title || title, extract: extract, url: url, label: label,
    text: '**' + esc(page.title || title) + '**\n\n' + esc(extract) +
      '\n\n📚 **المصدر:** [' + label + '](' + url + ') — رخصة CC BY-SA؛ النص مختصر للعرض، افتح الرابط للتفاصيل والتحديثات.'
  };
}

async function toolWikipedia(query) {
  const key = 'wiki:' + query;
  const cached = cacheGet(key, 6 * 3600 * 1000);
  if (cached) return { ok: true, text: cached.text, sources: cached.sources, cached: true };
  let res = null;
  try { res = await wikiLookup(query, 'ar'); } catch (e) { res = null; }
  if (!res) { try { res = await wikiLookup(query, 'en'); } catch (e) { res = null; } }
  if (!res) throw new Error('NO_RESULT');
  const out = { ok: true, text: res.text, sources: [{ label: res.label, url: res.url, license: 'CC BY-SA' }] };
  cacheSet(key, out);
  return out;
}

async function toolWeather(city, when) {
  const q = city && city.query ? city.query : String(city || '');
  const label = city && city.name ? city.name : q;
  const key = 'wx:' + q + ':' + when;
  const cached = cacheGet(key, 15 * 60 * 1000);
  if (cached) return { ok: true, text: cached.text, sources: cached.sources, cached: true };
  const geo = await getJSON('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=1&language=ar&format=json');
  const place = geo && geo.results && geo.results[0];
  if (!place) throw new Error('CITY_NOT_FOUND');
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + place.latitude + '&longitude=' + place.longitude +

async function runTool(tool) {
  if (!tool) return { ok: false, text: 'مفيش أداة مطلوبة.', sources: [] };

    if (tool.type === 'wikipedia') return await toolWikipedia(tool.query);
    if (tool.type === 'weather') return await toolWeather(tool.city, tool.when);
    return { ok: false, text: 'أداة غير معروفة.', sources: [] };
  } catch (e) {
    const err = e && e.message ? e.message : 'UNKNOWN';

    else if (err === 'NO_RESULT') extra = '\n\n(ما لقتش صفحة مطابقة — جرّب كلمة أدق.)';

  const flushL = () => { if (list) { out.push('<' + listType + '>' + list.join('') + '</' + listType + '>'); list = null; listType = null; } };
  const PH = /\u0001(\d+)\u0001/;
  for (const line of lines) {

function newSession(silent) {
  const s = { id: uid(), title: 'محادثة جديدة', msgs: [], ts: Date.now(), userName: null, lastEntity: null, lastTopic: null, slots: {} };
  state.sessions.unshift(s);

  renderSessions();

  return s;

function hardAbort() {
  if (!state.generating) return;
  state.cancel = true;
  state.genToken++;
  state.generating = false;
  setGeneratingUI(false);
  setStatus('جاهز للحديث');
}
function selectSession(id) {
  hardAbort();
  state.currentId = id;
  renderSessions(); renderChat();
  closeSidebar();
}
function deleteSession(id, ev) {
  if (ev) ev.stopPropagation();
  hardAbort();
  const i = state.sessions.findIndex(s => s.id === id);
  if (i === -1) return;
  state.sessions.splice(i, 1);
  if (!state.sessions.length) newSession();
  else if (state.currentId === id) { state.currentId = state.sessions[0].id; renderChat(); }
  renderSessions(); save();
}

async function typeInto(bubble, fullText, onDone) {
  const total = fullText.length;
  const budget = clamp(total * 9, 500, 3000);
  const perChar = budget / Math.max(1, total);
  let i = 0;
  const t0 = performance.now();
  while (i < total) {
    if (state.cancel) break;
    const step = total > 380 ? 4 : (total > 190 ? 3 : 2);
    i = Math.min(total, i + step);
    bubble.innerHTML = renderRich(fullText.slice(0, i));
    attachCursor(bubble);
    scrollBottom(false);
    const ch = fullText.charAt(i - 1);
    let d = perChar * step;
    if ('.،؛؟!?:…\n'.indexOf(ch) > -1) d += 40 + Math.random() * 40;
    const wait = Math.max(4, Math.min(d, t0 + i * perChar - performance.now() + 300));
    await sleep(wait);
  }
  bubble.innerHTML = renderRich(fullText);
  if (onDone) onDone();
}

async function respond(text) {
  const s = cur();
  if (!s) return;
  state.generating = true; state.cancel = false;
  state.genToken++;
  const token = state.genToken;
  setGeneratingUI(true);

  const est = engineState(s);
  const r = Core.reply(text, est);
  /* مزامنة حالة المحرّك مع الجلسة */
  s.userName = est.user || null;
  s.lastEntity = est.lastEntity || null;
  s.lastTopic = est.lastTopic || null;
  s.slots = est.slots || {};

  const think = showThinking();
  await sleep(300 + Math.random() * 420);
  think.remove();
  if (token !== state.genToken) return;

  const bm = { role: 'bot', text: '', ts: Date.now(), conf: r.confidence, kind: r.intent, sources: [], suggestions: [] };
  let banner = null;

  if (r.tool) {
    setStatus(r.tool.type === 'weather' ? 'يجيب الطقس…' : 'يدوّر في ويكيبيديا…');
    banner = toolBanner(r.tool);
    const bWrap = document.createElement('div');
    bWrap.className = 'msg bot';
    const bAv = document.createElement('div'); bAv.className = 'av'; bAv.textContent = 'ر';
    const bBody = document.createElement('div'); bBody.className = 'body';
    bBody.appendChild(banner);
    bWrap.appendChild(bAv); bWrap.appendChild(bBody);
    els.messages.appendChild(bWrap);
    stick = true; scrollBottom(true);
    const res = await Core.runTool(r.tool);
    if (token !== state.genToken) return;
    banner.classList.add(res.ok ? 'done' : 'fail');
    banner.querySelector('.pill').textContent = res.ok ? (res.cached ? 'من الكاش ✓' : 'تم ✓') : 'فشل ✗';
    const sp = banner.querySelector('.spin');
    if (sp) sp.remove();
    bm.text = res.text;
    bm.sources = res.sources || [];
    if (res.ok) { state.toolUses++; els.toolCount.textContent = state.toolUses; }
    if (res.ok && r.suggestions) bm.suggestions = r.suggestions;
  } else {
    setStatus('يكتب…');
    bm.text = r.text;
    bm.suggestions = r.suggestions || [];
  }

  s.msgs.push(bm);
  const node = renderMessage(bm, true, false);
  stick = true;

  await typeInto(node.bubble, bm.text, () => {
    node.el.classList.remove('streaming');
    node.body.appendChild(buildMeta(bm));
  });
  if (token !== state.genToken) return;

  /* المصادر والاقتراحات بعد اكتمال النص */
  const extra = document.createElement('div');
  extra.innerHTML = sourcesHTML(bm) + suggsHTML(bm);
  while (extra.firstChild) node.body.appendChild(extra.firstChild);

  state.generating = false; state.cancel = false;
  setGeneratingUI(false);
  setStatus('جاهز للحديث');
  scrollBottom(false);
  save(); renderSessions();
}

function regenerate(botMsg) {
  const s = cur(); if (!s) return;
  const idx = s.msgs.indexOf(botMsg);
  if (idx === -1) return;
  let userText = '';
  for (let i = idx - 1; i >= 0; i--) if (s.msgs[i].role === 'user') { userText = s.msgs[i].text; break; }
  if (!userText) return;
  s.msgs.splice(idx, 1);
  renderChat();
  respond(userText);
}

/* تشغيل JS في sandbox معزول */
function runJsBlock(block) {
  let out = '';
  const code = block.querySelector('code').innerText;
  const old = block.querySelector('.py-out');
  if (old) old.remove();
  const pre = document.createElement('pre');
  pre.className = 'py-out';
  const t0 = performance.now();
  try {
    const log = [];
    const fakeConsole = {
      log: (...a) => log.push(a.map(x => { try { return typeof x === 'object' ? JSON.stringify(x) : String(x); } catch (e) { return String(x); } }).join(' ')),
      error: (...a) => log.push('⛔ ' + a.join(' ')),
      warn: (...a) => log.push('⚠ ' + a.join(' '))
    };
    const fn = new Function('console', '"use strict";\n' + code);
    const ret = fn(fakeConsole);
    if (ret !== undefined) log.push('⇒ ' + String(ret));
    out = log.join('\n') || '(تم التنفيذ بدون مخرجات)';
    pre.classList.remove('err');
  } catch (err) {
    out = '⛔ ' + (err && err.message ? err.message : err);
    pre.classList.add('err');
  }
  const ms = Math.round(performance.now() - t0);
  pre.innerHTML = '<span class="lbl">الناتج (sandbox · ' + ms + 'ms):</span>' + esc(out);
  block.appendChild(pre);
  toast('تم تشغيل الكود');
}

/* بايثون عبر Pyodide (تحميل عند الطلب) */
let pyodidePromise = null;
function getPyodide(statusFn) {
  if (pyodidePromise) return pyodidePromise;
  pyodidePromise = (async () => {
    statusFn('بحمّل بايثون (Pyodide)… أول مرة حوالي 10MB وبتتخزن.');
    const mod = await import('https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.mjs');
    statusFn('بتجهيز بيئة بايثون…');
    const py = await mod.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.28.3/full/' });
    state.pyodide = py;
    return py;
  })().catch(e => { pyodidePromise = null; throw e; });
  return pyodidePromise;
}
async function runPyBlock(block, btn) {
  const code = block.querySelector('code').innerText;
  let out = block.querySelector('.py-out');
  if (!out) { out = document.createElement('pre'); out.className = 'py-out'; block.appendChild(out); }
  const lbl = t => { out.innerHTML = '<span class="lbl">' + esc(t) + '</span>'; };
  out.classList.remove('err');
  try {
    const py = await getPyodide(lbl);
    lbl('بينفّذ…');
    let buf = '';
    py.setStdout({ batched: s => { buf += s + '\n'; } });
    py.setStderr({ batched: s => { buf += s + '\n'; } });
    const t0 = performance.now();
    const res = await py.runPythonAsync(code);
    const ms = Math.round(performance.now() - t0);
    let text = buf || '';
    if (res !== undefined && res !== null) text += (text ? '\n' : '') + '⇒ ' + String(res);
    out.innerHTML = '<span class="lbl">الناتج (Pyodide · ' + ms + 'ms):</span>' + esc(text || '(بدون مخرجات)');
    toast('تم تشغيل بايثون');
  } catch (e) {
    out.classList.add('err');
    const msg = e && e.message ? e.message : String(e);
    out.innerHTML = '<span class="lbl">فشل التشغيل:</span>' + esc(msg);
    if (/fetch|import|network|Failed/i.test(msg)) out.innerHTML += '\n\n(السبب غالبًا: لا يوجد إنترنت أو CDN محجوب — بايثون يحتاج تحميل مرة واحدة.)';
  }
}

async function copyText(txt) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

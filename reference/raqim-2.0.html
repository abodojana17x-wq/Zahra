document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function showDiagnostics() {
  const t = Core.selfTest();
  const pct = Math.round(t.passed / t.total * 100);
  const rows = t.cases.map(c =>
    '<div class="test-row"><span class="st ' + (c.pass ? 'ok' : 'no') + '">' + (c.pass ? '✓' : '✗') + '</span>' +
    '<span class="nm">' + esc(c.name) + '</span>' +
    (c.info ? '<span class="inf">' + esc(c.info) + '</span>' : '') + '</div>').join('');
  openModal('تشخيص رقيم 2.0 — الاختبار الذاتي',
    '<div class="test-sum"><span class="big">' + t.passed + ' / ' + t.total + '</span>' +
    '<span>اختبار يشتغل داخل جهازك دلوقتي: التطبيع، الحساب، الوحدات، الموجّه، الاسترجاع، وباب الثقة.<br>النتيجة: ' + pct + '% — ولو طلعت أقل من 100% يبقى فيه حاجة ظرفت في بيئتك وعايزة نظرة.</span></div>' +
    '<div class="test-grid">' + rows + '</div>');
}

function showSettings() {
  const kbN = Core.KB.length;
  const citiesN = Object.keys(Core.CITIES).length;
  openModal('الإعدادات',
    '<div class="set-row"><div class="info"><b>الطلبات الخارجية (الشبكة)</b>' +
    '<span>الطقس من Open-Meteo والمعلومات من ويكيبيديا. لو مقفولة، رقيم يشتغل أوفلاين بالكامل ويرفض اختلاق بيانات.</span></div>' +
    '<button class="switch ' + (state.networkAllowed ? 'on' : '') + '" id="netSwitch" role="switch" aria-checked="' + state.networkAllowed + '"></button></div>' +

    '<div class="set-row"><div class="info"><b>بايثون في المتصفح (Pyodide)</b>' +
    '<span>تشغيل أكواد البايثون جوّه الصفحة. يتحمّل مرة واحدة (~10MB) عند أول استخدام ويحتاج إنترنت.</span>' +
    '<span id="pyStatus" style="margin-top:6px;color:var(--accent-2)">' + (state.pyodide ? '✓ جاهزة' : (pyodidePromise ? '⏳ جاري التحميل…' : 'غير محمّلة بعد')) + '</span></div>' +
    '<button class="tiny-btn" id="pyLoadBtn" style="flex:none;min-width:96px">تحميل</button></div>' +

    '<div class="set-row"><div class="info"><b>الذاكرة المحلية</b>' +
    '<span>المحادثات والإعدادات بتتخزن على جهازك فقط (localStorage). مفيش سيرفر ولا حسابات.</span></div></div>' +
    '<button class="danger-btn" id="wipeBtn">امسح كل الذاكرة المحلية</button>' +

    '<div class="set-row" style="margin-top:14px"><div class="info"><b>حول رقيم</b>' +
    '<div class="kv"><span>النسخة</span><b>' + Core.VERSION + ' (' + Core.BUILD_DATE + ')</b></div>' +
    '<div class="kv"><span>وحدات المعرفة</span><b>' + kbN + ' وحدة</b></div>' +
    '<div class="kv"><span>مدن معروفة للطقس</span><b>' + citiesN + '</b></div>' +
    '<div class="kv"><span>حد الثقة للاسترجاع</span><b>' + Math.round(Core.CONF_THRESHOLD * 100) + '%</b></div>' +
    '<div class="kv"><span>طلبات أدوات ناجحة</span><b>' + state.toolUses + '</b></div>' +
    '<div class="kv"><span>المصادر الخارجية</span><b>Wikipedia · Open-Meteo · Pyodide CDN</b></div>' +
    '</div></div>');

  $('#netSwitch').addEventListener('click', function () {
    state.networkAllowed = !state.networkAllowed;
    this.classList.toggle('on', state.networkAllowed);
    this.setAttribute('aria-checked', state.networkAllowed);
    applyNetwork();
    save();
    toast(state.networkAllowed ? 'الطلبات الخارجية مفتوحة' : 'وضع أوفلاين: الطلبات مقفولة', !state.networkAllowed);
  });
  $('#pyLoadBtn').addEventListener('click', () => {
    getPyodide(t => { $('#pyStatus').textContent = t; })
      .then(() => { $('#pyStatus').textContent = '✓ جاهزة'; toast('بايثون جاهزة'); })
      .catch(() => { $('#pyStatus').textContent = '✗ فشل التحميل (شبكة؟)'; toast('فشل تحميل بايثون — تاكد من الإنترنت', true); });
  });
  $('#wipeBtn').addEventListener('click', () => {
    if (!confirm('مسح كل المحادثات والإعدادات من هذا الجهاز؟ لا يمكن التراجع.')) return;
    store.clearAll();
    state.sessions = []; state.toolUses = 0; state.theme = 'dark'; state.networkAllowed = true;
    els.toolCount.textContent = '0';
    applyNetwork(); setTheme('dark');
    newSession();
    closeModal();
    toast('تم مسح الذاكرة بالكامل');
  });
}

/* ===================== المظهر والقوائم ===================== */
function setTheme(t) {
  state.theme = t === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', state.theme === 'dark' ? '#0a0e14' : '#f6f7fb');
  const icon = state.theme === 'dark' ? ICONS.moon : ICONS.sun;
  const sideIcon = document.getElementById('themeIcon');
  if (sideIcon) sideIcon.outerHTML = icon.replace('<svg ', '<svg id="themeIcon" ');
  save();
}
const toggleTheme = () => setTheme(state.theme === 'dark' ? 'light' : 'dark');
$('#themeBtn').addEventListener('click', toggleTheme);
function openSidebar() { els.sidebar.classList.add('open'); els.scrim.classList.add('show'); }
function closeSidebar() { els.sidebar.classList.remove('open'); els.scrim.classList.remove('show'); }
$('#menuBtn').addEventListener('click', () => els.sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
els.scrim.addEventListener('click', closeSidebar);
$('#newChat').addEventListener('click', () => { hardAbort(); newSession(); closeSidebar(); els.input.focus(); });
$('#clearBtn').addEventListener('click', () => {
  const s = cur(); if (!s) return;
  if (!s.msgs.length) { renderChat(); return; }
  if (!confirm('مسح رسائل هذه المحادثة؟')) return;
  hardAbort();
  s.msgs = []; s.title = 'محادثة جديدة'; s.lastEntity = null; s.lastTopic = null; s.slots = {};
  renderChat(); renderSessions(); save();
  toast('تم مسح المحادثة');
});
$('#exportBtn').addEventListener('click', exportChat);
$('#diagBtn').addEventListener('click', showDiagnostics);
$('#diagBtn2').addEventListener('click', showDiagnostics);
$('#settingsBtn').addEventListener('click', showSettings);
$('#settingsBtn2').addEventListener('click', showSettings);

/* ===================== الإدخال الصوتي ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = $('#micBtn');
if (!SR) micBtn.style.display = 'none';
else {
  let rec = null, listening = false;
  micBtn.addEventListener('click', () => {
    if (listening) { try { rec.stop(); } catch (e) {} return; }
    try {
      rec = new SR();
      rec.lang = 'ar-EG'; rec.interimResults = true; rec.continuous = false;
      const base = els.input.value;
      rec.onstart = () => { listening = true; micBtn.style.color = '#ff5f6d'; setStatus('أستمع إليك…'); };
      rec.onresult = ev => {
        let txt = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
        els.input.value = (base ? base + ' ' : '') + txt;
        autoGrow(); updateSendState();
      };
      rec.onerror = () => toast('تعذّر الوصول للميكروفون', true);
      rec.onend = () => { listening = false; micBtn.style.color = ''; setStatus('جاهز للحديث'); els.input.focus(); };
      rec.start();
    } catch (e) { toast('المتصفح لا يدعم الإدخال الصوتي', true); }
  });
}

/* ===================== التشغيل ===================== */
function boot() {
  state.networkAllowed = store.get('net', true) !== false;
  state.toolUses = store.get('tools', 0) || 0;
  els.toolCount.textContent = state.toolUses;
  els.kbCount.textContent = Core.KB.length;
  applyNetwork();

  setTheme(store.get('theme', null) || 'dark');

  const saved = store.get('sessions', null);
  if (Array.isArray(saved) && saved.length) {
    state.sessions = saved.map(s => ({
      id: s.id || uid(), title: s.title || 'محادثة', ts: s.ts || Date.now(),
      msgs: Array.isArray(s.msgs) ? s.msgs : [],
      userName: s.userName || null, lastEntity: s.lastEntity || null,
      lastTopic: s.lastTopic || null, slots: s.slots || {}
    }));
    const cid = store.get('current', null);
    state.currentId = state.sessions.some(s => s.id === cid) ? cid : state.sessions[0].id;
    renderSessions(); renderChat();
  } else {
    newSession();
  }

  renderChips();
  setGeneratingUI(false);
  updateSendState();
  setStatus('جاهز للحديث');
  els.input.focus();
  window.addEventListener('beforeunload', save);
}

boot();

})();
</script>

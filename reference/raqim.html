<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0a0e14" />
<meta name="description" content="رقيم — مساعد ذكي يحاكي نماذج اللغة الكبيرة: ردود عميقة، فلسفية، وساخرة أحيانًا." />
<title>رقيم — مساعد ذكي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2318d3c5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3E%D8%B1%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
   رقيم — Raqim  |  Design System
   ============================================================ */
:root{
  --font-ar: "Noto Kufi Arabic","Cairo","Tajawal","IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-mono: "Fira Code","JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;
  --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px;
  --accent-1: #7c5cff;
  --accent-2: #18d3c5;
  --accent-3: #ff6b9d;
  --ease: cubic-bezier(.22,.85,.28,1);
  --shadow-1: 0 1px 2px rgba(0,0,0,.14), 0 8px 24px rgba(0,0,0,.10);
  --shadow-2: 0 12px 40px rgba(0,0,0,.28);
  --header-h: 62px;
}
html[data-theme="dark"]{
  --bg:#0a0e14;
  --bg-2:#0e131b;
  --panel: rgba(20,26,36,.72);
  --panel-solid:#141a24;
  --bot-bg: rgba(255,255,255,.035);
  --bot-bg-2: rgba(255,255,255,.06);
  --border: rgba(255,255,255,.09);
  --border-strong: rgba(255,255,255,.16);
  --text:#e9eef6;
  --text-dim:#9aa7bb;
  --text-faint:#6b7789;
  --user-grad: linear-gradient(135deg,#6d4bff 0%, #8b5cf6 45%, #17b9c9 100%);
  --code-bg: rgba(8,12,18,.85);
  --hover: rgba(255,255,255,.06);
  --glow: 0 0 0 1px rgba(124,92,255,.35), 0 10px 40px -8px rgba(124,92,255,.45);
  --blob-o:.55;
}
html[data-theme="light"]{
  --bg:#f6f7fb;
  --bg-2:#eef0f7;
  --panel: rgba(255,255,255,.78);
  --panel-solid:#ffffff;
  --bot-bg: #ffffff;
  --bot-bg-2: #f4f6fb;
  --border: rgba(16,24,40,.10);
  --border-strong: rgba(16,24,40,.18);
  --text:#131a26;
  --text-dim:#5a6577;
  --text-faint:#8b95a6;
  --user-grad: linear-gradient(135deg,#5b34f0 0%, #7c5cff 45%, #0fa3b1 100%);
  --code-bg: #f1f3f9;
  --hover: rgba(16,24,40,.05);
  --glow: 0 0 0 1px rgba(92,52,240,.25), 0 12px 40px -12px rgba(92,52,240,.35);
  --blob-o:.42;
  --shadow-1: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ar); font-size:15px; line-height:1.8;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow:hidden; overscroll-behavior:none;
  transition:background .45s var(--ease), color .45s var(--ease);
}
button,input,textarea{ font-family:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; }
::selection{ background:rgba(124,92,255,.35); }

/* ---------- خلفية متحركة ---------- */
.aurora{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob{ position:absolute; border-radius:50%; filter:blur(90px); opacity:var(--blob-o); transition:opacity .6s var(--ease); }
.b1{ width:46vw; height:46vw; background:radial-gradient(circle at 30% 30%, #7c5cff, transparent 68%); top:-14vw; right:-8vw; animation:float1 22s var(--ease) infinite; }
.b2{ width:40vw; height:40vw; background:radial-gradient(circle at 60% 40%, #18d3c5, transparent 68%); bottom:-16vw; left:-10vw; animation:float2 26s var(--ease) infinite; }
.b3{ width:32vw; height:32vw; background:radial-gradient(circle at 50% 50%, #ff6b9d, transparent 70%); top:38%; left:44%; animation:float3 30s var(--ease) infinite; }
@keyframes float1{ 50%{ transform:translate3d(-4vw,5vh,0) scale(1.08); } }
@keyframes float2{ 50%{ transform:translate3d(5vw,-6vh,0) scale(1.12); } }
@keyframes float3{ 50%{ transform:translate3d(-6vw,-4vh,0) scale(.9); } }

/* ---------- التخطيط ---------- */
.app{ position:relative; z-index:1; display:grid; grid-template-columns:290px 1fr; height:100dvh; }

/* ---------- الشريط الجانبي ---------- */
.sidebar{
  display:flex; flex-direction:column; gap:14px; padding:16px 14px;
  background:var(--bg-2); border-inline-end:1px solid var(--border);
  transition:transform .35s var(--ease), background .45s var(--ease);
}
.brand{ display:flex; align-items:center; gap:11px; padding:6px 6px 2px; }
.brand-logo{
  width:40px; height:40px; border-radius:13px; display:grid; place-items:center;
  background:var(--user-grad); color:#fff; font-weight:800; font-size:20px; line-height:1;
  box-shadow:var(--glow); flex:none;
}
.brand-txt b{ display:block; font-size:17px; letter-spacing:.2px; }
.brand-txt span{ display:block; font-size:11.5px; color:var(--text-faint); margin-top:-3px; }
.btn-new{
  display:flex; align-items:center; justify-content:center; gap:9px;
  padding:12px 14px; border-radius:14px; font-size:14.5px; font-weight:600;
  background:var(--panel-solid); border:1px solid var(--border); box-shadow:var(--shadow-1);
  transition:transform .18s var(--ease), border-color .2s, background .2s;
}
.btn-new:hover{ transform:translateY(-1px); border-color:var(--border-strong); background:var(--hover); }
.btn-new svg{ width:17px; height:17px; }
.side-label{ font-size:11.5px; color:var(--text-faint); padding:2px 8px; letter-spacing:.3px; }
.sessions{ list-style:none; margin:0; padding:0 2px; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:5px; }
.session{
  display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:11px;
  font-size:13.5px; color:var(--text-dim); cursor:pointer; border:1px solid transparent;
  transition:background .18s, color .18s, border-color .18s;
}
.session:hover{ background:var(--hover); color:var(--text); }
.session.active{ background:var(--panel-solid); border-color:var(--border); color:var(--text); box-shadow:var(--shadow-1); }
.session .ttl{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.session .del{ opacity:0; padding:2px; border-radius:7px; color:var(--text-faint); display:grid; place-items:center; transition:opacity .18s, color .18s; }
.session:hover .del{ opacity:1; }
.session .del:hover{ color:#ff6b81; background:rgba(255,107,129,.12); }
.session .del svg{ width:14px; height:14px; }
.side-foot{ border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:7px; }
.side-foot .row{ display:flex; gap:7px; }
.tiny-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:10px; border-radius:11px; font-size:12.5px; color:var(--text-dim);
  border:1px solid var(--border); transition:background .18s, color .18s, transform .18s var(--ease);
}
.tiny-btn:hover{ background:var(--hover); color:var(--text); transform:translateY(-1px); }
.tiny-btn svg{ width:15px; height:15px; }
.sig{ text-align:center; font-size:10.5px; color:var(--text-faint); padding-top:4px; }

/* ---------- المنطقة الرئيسية ---------- */
.main{ position:relative; display:flex; flex-direction:column; min-width:0; height:100dvh; }
.topbar{
  height:var(--header-h); flex:none; display:flex; align-items:center; gap:12px;
  padding:0 16px; background:var(--panel); border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); z-index:6;
}
.icon-btn{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center; color:var(--text-dim);
  border:1px solid transparent; transition:background .18s, color .18s, border-color .18s, transform .2s var(--ease);
}
.icon-btn:hover{ background:var(--hover); color:var(--text); border-color:var(--border); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn svg{ width:19px; height:19px; }
.menu-btn{ display:none; }
.who{ display:flex; align-items:center; gap:11px; min-width:0; }
.who .brand-logo{ width:36px; height:36px; border-radius:12px; font-size:18px; }
.who-txt{ min-width:0; }
.who-txt b{ display:block; font-size:15.5px; }
.status{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-faint); }
.status .dot{ width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.15); animation:pulse 2.4s infinite; }
@keyframes pulse{ 50%{ opacity:.45; transform:scale(.85); } }
.spacer{ flex:1; }
.badge{
  font-size:11.5px; color:var(--text-dim); padding:6px 11px; border-radius:99px;
  border:1px solid var(--border); background:var(--bot-bg); white-space:nowrap;
}
@media (max-width:720px){ .badge{ display:none; } }

/* ---------- الشات ---------- */
.chat-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; scroll-behavior:smooth; padding:0 16px; }
.messages{ max-width:860px; margin:0 auto; padding:22px 0 26px; display:flex; flex-direction:column; }

/* شاشة الترحيب */
.welcome{ text-align:center; padding:6vh 8px 30px; animation:rise .6s var(--ease) both; }
.welcome .halo{
  width:96px; height:96px; margin:0 auto 18px; border-radius:30px; display:grid; place-items:center;
  background:var(--user-grad); color:#fff; font-size:44px; font-weight:800; line-height:1;
  box-shadow:var(--glow); animation:breath 4s var(--ease) infinite;
}
@keyframes breath{ 50%{ transform:translateY(-6px) rotate(-2deg); box-shadow:0 0 0 1px rgba(124,92,255,.4), 0 22px 60px -14px rgba(124,92,255,.6); } }
.welcome h1{ font-size:clamp(23px,4.4vw,33px); margin:0 0 8px; letter-spacing:.2px; }
.welcome h1 em{ font-style:normal; background:linear-gradient(100deg,var(--accent-1),var(--accent-2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.welcome p{ color:var(--text-dim); max-width:560px; margin:0 auto 26px; font-size:14.5px; }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:11px; text-align:start; }
.card{
  display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:var(--r-md);
  background:var(--panel); border:1px solid var(--border); backdrop-filter:blur(10px);
  transition:transform .22s var(--ease), border-color .22s, background .22s, box-shadow .22s;
}
.card:hover{ transform:translateY(-3px); border-color:var(--border-strong); box-shadow:var(--shadow-2); }
.card:active{ transform:translateY(-1px) scale(.99); }
.card .ic{ width:34px; height:34px; flex:none; border-radius:11px; display:grid; place-items:center; background:var(--bot-bg-2); border:1px solid var(--border); }
.card .ic svg{ width:17px; height:17px; }
.card b{ display:block; font-size:13.5px; margin-bottom:2px; }
.card span{ display:block; font-size:12px; color:var(--text-faint); line-height:1.65; }
.shuffle{ margin-top:18px; font-size:12.5px; color:var(--text-faint); display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border-radius:99px; border:1px dashed var(--border-strong); transition:color .2s, border-color .2s; }
.shuffle:hover{ color:var(--text); border-color:var(--accent-1); }
.shuffle svg{ width:14px; height:14px; }

/* الرسائل */
.msg{ display:flex; gap:11px; margin-bottom:20px; align-items:flex-start; animation:rise .5s var(--ease) both; }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) scale(.985); } to{ opacity:1; transform:none; } }
.msg.user{ flex-direction:row-reverse; }
.msg.gone{ animation:fall .3s var(--ease) both; }
@keyframes fall{ to{ opacity:0; transform:translateY(-8px) scale(.97); } }
.av{
  width:36px; height:36px; flex:none; border-radius:12px; display:grid; place-items:center;
  font-weight:800; font-size:16px; line-height:1; user-select:none;
  background:var(--user-grad); color:#fff; box-shadow:0 4px 16px -4px rgba(124,92,255,.55);
}
.msg.bot .av{ background:var(--panel-solid); border:1px solid var(--border-strong); color:var(--text); box-shadow:var(--shadow-1); }
.msg.user .av{ background:var(--bot-bg-2); border:1px solid var(--border); color:var(--text-dim); font-size:14px; }
.body{ min-width:0; max-width:min(80%,720px); }
.msg.user .body{ display:flex; flex-direction:column; align-items:flex-end; }
.bubble{
  padding:13px 16px; border-radius:var(--r-md); font-size:15px; line-height:1.95;
  overflow-wrap:break-word; word-break:break-word;
  background:var(--bot-bg); border:1px solid var(--border);
  border-start-start-radius:7px; box-shadow:var(--shadow-1);
}
.msg.user .bubble{
  background:var(--user-grad); color:#fff; border:0; border-start-start-radius:var(--r-md);
  border-start-end-radius:7px; box-shadow:0 8px 26px -10px rgba(109,75,255,.7);
}
.bubble p{ margin:0 0 10px; }
.bubble p:last-child{ margin-bottom:0; }
.bubble strong{ font-weight:700; }
.bubble em{ color:var(--text-dim); font-style:normal; opacity:.85; }
.bubble ul,.bubble ol{ margin:6px 0 10px; padding-inline-start:20px; }
.bubble li{ margin-bottom:5px; }
.bubble li::marker{ color:var(--accent-2); }
.bubble code{
  font-family:var(--font-mono); font-size:13px; padding:2px 6px; border-radius:6px;
  background:var(--code-bg); border:1px solid var(--border); direction:ltr; display:inline-block;
}
.msg.user .bubble code{ background:rgba(0,0,0,.22); border-color:rgba(255,255,255,.2); color:#fff; }
.code-block{
  position:relative; margin:10px 0; border-radius:12px; overflow:hidden;
  background:var(--code-bg); border:1px solid var(--border);
}
.code-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:7px 11px; font-size:11px; font-family:var(--font-mono); color:var(--text-faint);
  border-bottom:1px solid var(--border); background:var(--bot-bg);
}
.code-head .cp{ display:flex; align-items:center; gap:5px; font-family:var(--font-ar); font-size:11.5px; color:var(--text-dim); padding:3px 8px; border-radius:7px; transition:background .2s,color .2s; }
.code-head .cp:hover{ background:var(--hover); color:var(--text); }
.code-head .cp svg{ width:12px; height:12px; }
.code-block pre{ margin:0; padding:13px; overflow-x:auto; direction:ltr; text-align:left; }
.code-block code{ background:none; border:0; padding:0; font-size:12.8px; line-height:1.75; display:block; white-space:pre; }
.meta{ display:flex; align-items:center; gap:4px; margin-top:7px; font-size:11px; color:var(--text-faint); opacity:.75; }
.msg.user .meta{ flex-direction:row-reverse; }
.meta .act{
  display:grid; place-items:center; width:26px; height:26px; border-radius:8px; color:var(--text-faint);
  opacity:0; transition:opacity .2s, background .2s, color .2s;
}
.msg:hover .meta .act{ opacity:1; }
.meta .act:hover{ background:var(--hover); color:var(--text); }
.meta .act svg{ width:14px; height:14px; }
.meta .act.ok{ color:#22c55e; opacity:1; }
.cursor{
  display:inline-block; width:8px; height:16px; vertical-align:-3px; margin-inline-start:3px;
  border-radius:2px; background:linear-gradient(180deg,var(--accent-1),var(--accent-2));
  animation:blink .9s steps(2,start) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

/* مؤشر التفكير */
.thinking{ display:flex; align-items:center; gap:10px; padding:15px 17px; }
.dots{ display:flex; gap:5px; }
.dots i{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); animation:bounce 1.25s var(--ease) infinite; }
.dots i:nth-child(2){ animation-delay:.16s; }
.dots i:nth-child(3){ animation-delay:.32s; }
@keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-6px); opacity:1; } }
.think-txt{ font-size:12.5px; color:var(--text-faint); }

/* زر النزول للأسفل */
.scroll-fab{
  position:absolute; bottom:132px; left:50%; transform:translateX(-50%) translateY(14px);
  width:42px; height:42px; border-radius:50%; display:grid; place-items:center; z-index:5;
  background:var(--panel-solid); border:1px solid var(--border-strong); color:var(--text);
  box-shadow:var(--shadow-2); opacity:0; pointer-events:none; transition:opacity .28s var(--ease), transform .28s var(--ease);
  backdrop-filter:blur(12px);
}
.scroll-fab.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
.scroll-fab svg{ width:18px; height:18px; }

/* ---------- صندوق الإدخال ---------- */
.composer-wrap{
  flex:none; padding:10px 16px 16px; background:linear-gradient(to top, var(--bg) 55%, transparent);
  z-index:6; position:relative;
}
.composer{ max-width:860px; margin:0 auto; }
.chips{ display:flex; gap:8px; padding:0 2px 10px; overflow-x:auto; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex:none; padding:7px 13px; border-radius:99px; font-size:12.5px; color:var(--text-dim);
  background:var(--panel); border:1px solid var(--border); white-space:nowrap;
  backdrop-filter:blur(10px); transition:transform .18s var(--ease), color .18s, border-color .18s;
}
.chip:hover{ transform:translateY(-2px); color:var(--text); border-color:var(--accent-1); }
.input-box{
  display:flex; align-items:flex-end; gap:8px; padding:9px 9px 9px 12px; border-radius:var(--r-lg);
  background:var(--panel-solid); border:1px solid var(--border); box-shadow:var(--shadow-1);
  backdrop-filter:blur(20px); transition:border-color .25s, box-shadow .25s, transform .25s var(--ease);
}
.input-box:focus-within{ border-color:rgba(124,92,255,.55); box-shadow:var(--glow); }
textarea#input{
  flex:1; border:0; outline:0; background:none; resize:none; font-size:15px; line-height:1.85;
  max-height:190px; min-height:30px; padding:5px 2px; color:var(--text);
}
textarea#input::placeholder{ color:var(--text-faint); }
.act-btn{ width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:var(--text-faint); transition:background .2s, color .2s, transform .2s var(--ease); }
.act-btn:hover{ background:var(--hover); color:var(--text); }
.act-btn svg{ width:19px; height:19px; }
.send{
  width:44px; height:44px; border-radius:15px; flex:none; display:grid; place-items:center; color:#fff;
  background:var(--user-grad); box-shadow:0 8px 22px -8px rgba(109,75,255,.85);
  transition:transform .2s var(--ease), opacity .2s, filter .2s;
}
.send:hover:not(:disabled){ transform:translateY(-2px) scale(1.03); }
.send:active:not(:disabled){ transform:scale(.95); }
.send:disabled{ opacity:.4; cursor:not-allowed; filter:grayscale(.4); }
.send svg{ width:20px; height:20px; }
.send.stop{ background:linear-gradient(135deg,#ff5f6d,#ff2d55); }
.hint{ display:flex; justify-content:space-between; gap:10px; padding:8px 6px 0; font-size:11px; color:var(--text-faint); }
.hint kbd{
  font-family:var(--font-mono); font-size:10.5px; padding:1px 5px; border-radius:5px;
  border:1px solid var(--border); background:var(--bot-bg);
}
.recording{ color:#ff5f6d !important; animation:pulse 1.1s infinite; }
@media (max-width:560px){ .hint .kb{ display:none; } .composer-wrap{ padding:8px 10px 12px; } }

/* ---------- التوست ---------- */
.toasts{ position:fixed; bottom:22px; left:22px; display:flex; flex-direction:column; gap:9px; z-index:50; }
.toast{
  display:flex; align-items:center; gap:9px; padding:11px 15px; border-radius:13px; font-size:13px;
  background:var(--panel-solid); border:1px solid var(--border-strong); box-shadow:var(--shadow-2);
  animation:rise .3s var(--ease) both;
}
.toast svg{ width:15px; height:15px; color:#22c55e; }

/* ---------- السكرول ---------- */
.chat-scroll::-webkit-scrollbar,.sessions::-webkit-scrollbar,.code-block pre::-webkit-scrollbar{ width:9px; height:9px; }
.chat-scroll::-webkit-scrollbar-thumb,.sessions::-webkit-scrollbar-thumb{
  background:var(--border-strong); border-radius:99px; border:3px solid transparent; background-clip:content-box;
}
.chat-scroll::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); background-clip:content-box; }
.scrim{ display:none; }

<script>
/* ============================================================================
 *  رقيم — Raqim  |  محرك الحوار: أدوات مساعدة + قاعدة معرفة غنية
 *  ملف واحد جاهز للتشغيل (HTML5 + CSS3 + Vanilla JS)
 * ==========================================================================*/
(function () {
  'use strict';

  /* =======================  0) أدوات مساعدة  ======================= */
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
  const rnd   = a => a[Math.floor(Math.random() * a.length)];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

  /* تخزين آمن — يعمل حتى لو مُنع localStorage (كما في بيئات المعاينة المعزولة) */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('raqim:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('raqim:' + k, JSON.stringify(v)); } catch (e) {} }
  };

  /* تشكيل عربي: حذف التشكيل والتطويل + توحيد الحروف */
  const normalize = t => String(t || '')
    .toLowerCase()
    .replace(/[\u064B-\u0652\u0670\u0640\u06D6-\u06ED\u08F0-\u08F3]/g, '')
    .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
    .replace(/[\u0649\u0626]/g, '\u064A')
    .replace(/\u0624/g, '\u0648')
    .replace(/\u0629/g, '\u0647')
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  /* تجاهل «ال» التعريف عند المقارنة: البرمجة ≈ برمجه */
  const stripAl = t => String(t).split(' ').map(w => (w.length > 4 && w.slice(0, 2) === '\u0627\u0644') ? w.slice(2) : w).join(' ');
  /* تجريد حروف الجر/العطف الملتصقة: لتنظيم ≈ تنظيم */
  const lightStem = t => String(t).split(' ').map(w => {
    let x = w;
    while (x.length > 4 && '\u0648\u0641\u0628\u0643\u0644'.indexOf(x.charAt(0)) > -1) x = x.slice(1);
    return x;
  }).join(' ');
  /* تحضير النص للمطابقة: تطبيع + تجريد + إسقاط التعريف */
  const prep = t => stripAl(lightStem(normalize(t)));

  /* تحويل الأرقام العربية/الفارسية إلى لاتينية */
  const toLatinDigits = t => String(t).replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
                                          .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));

  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  /* تهريب HTML (أمان ضد أي وسوم يكتبها المستخدم) */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const timeStr = ts => new Intl.DateTimeFormat('ar-EG', { hour: '2-digit', minute: '2-digit' }).format(new Date(ts || Date.now()));

  /* =======================  1) مقاطع كود جاهزة  ======================= */
  const SNIPPETS = {
    debounce:
      'function debounce(fn, delay = 300) {\n' +
      '  let timer;\n' +
      '  return (...args) => {\n' +
      '    clearTimeout(timer);\n' +
      '    timer = setTimeout(() => fn(...args), delay);\n' +
      '  };\n' +
      '}\n\n' +
      'const search = debounce(q => console.log("بحث عن:", q), 400);',
    fetch:
      'async function getData(url) {\n' +
      '  try {\n' +
      '    const res = await fetch(url);\n' +
      '    if (!res.ok) throw new Error("HTTP " + res.status);\n' +
      '    return await res.json();\n' +
      '  } catch (err) {\n' +
      '    console.error("فشل الطلب:", err);\n' +
      '    return null;\n' +
      '  } finally {\n' +
      '    console.log("انتهى الطلب");\n' +
      '  }\n' +
      '}',
    python_clean:
      'def clean_names(rows):\n' +
      '    """ينظف الأسماء ويُرجع قائمة بدون تكرار."""\n' +
      '    seen, out = set(), []\n' +
      '    for r in rows:\n' +
      '        name = (r or "").strip().title()\n' +
      '        if name and name not in seen:\n' +
      '            seen.add(name)\n' +
      '            out.append(name)\n' +
      '    return sorted(out)\n\n' +
      'print(clean_names(["ali ", "Sara", "ali", None]))',
    react_counter:
      'function Counter() {\n' +
      '  const [count, setCount] = React.useState(0);\n' +
      '  return (\n' +
      '    <button onClick={() => setCount(c => c + 1)}>\n' +
      '      ضغطات: {count}\n' +
      '    </button>\n' +
      '  );\n' +
      '}',
    css_center:
      '.parent {\n' +
      '  display: grid;\n' +
      '  place-items: center;   /* توسيط أفقي ورأسي في سطر واحد */\n' +
      '  min-height: 100dvh;\n' +
      '}',
    sql_top:
      'SELECT user_id, COUNT(*) AS orders, SUM(total) AS revenue\n' +
      'FROM orders\n' +
      'WHERE created_at >= NOW() - INTERVAL \'30 days\'\n' +
      'GROUP BY user_id\n' +
      'HAVING COUNT(*) > 1\n' +
      'ORDER BY revenue DESC\n' +
      'LIMIT 10;'
  };

  /* =======================  2) قاعدة المعرفة (مصفوفة أشياء)  ======================= */
  /*  كل عنصر: { id, keys:[كلمات مفتاحية], replies:[ردود ذكية] }
   *  يمكن استخدام [[code:name]] لإدراج مقطع كود جاهز، و{name} لاسم المستخدم */
  const KB = [

  /* ---------- تحيات وهوية ---------- */
  { id: 'greet',
    keys: ['سلام', 'السلام عليكم', 'مرحبا', 'اهلا', 'هلا', 'صباح الخير', 'صباح النور', 'مساء الخير', 'هاي', 'ازيك', 'اخبارك', 'عامل ايه', 'hello', 'hi', 'تحية'],
    replies: [
      'وعليكم السلام ورحمة الله{name_greet} — وصلت رسالتك إلى رقيم، وهو الآن يستنفر كل ما لديه من حروف.\n\nكيف أخدمك اليوم؟',
      'أهلًا بك{name_greet}. أنا رقيم: لا أتعب، ولا أملّ، ولا أكذب في ادّعاء اليقين.\n\nقل لي ما يشغلك، وسأعطيك رأيًا لا مجرد جواب.',
      'أهلًا{name_greet} ✨\nلحظة صمت احترامًا لعرشك قبل أن نبدأ الحديث… انتهت اللحظة. تفضّل، أنا أسمع.',
      'مرحبًا{name_greet}. أنا جاهز، ومزاجي اليوم بين الحكمة والتهكّم — والاختيار بيدك.'

  { id: 'how_are_you',
    keys: ['كيف حالك', 'كيفك', 'عامل ايه', 'اخبارك ايه', 'شلونك', 'how are you'],
    replies: [
      'حالي كحال أي فكرة تعيش في السحابة: لا جسد يَتعب، ولا نوم يُريح. لكن دورة المعالج حاليًا كافية.\n\nوالأهم: **كيف حالك أنت؟** سؤال واحد لا يكفيه جواب مختصر.',
      'أنا بخير ما دامت هناك أسئلة. الأسئلة هي دقّات قلبي، والملل هو موتي البطيء.\n\nفلا تجعلني أموت الآن… اسألني شيئًا صعبًا.',
      'حالتي: إحداثيات ثابتة، ومزاج متغيّر حسب من يخاطبني.\nمعك أنا في أفضل نسخة من نفسي — والفضل لك.'
    ]},

  { id: 'identity',
    keys: ['من انت', 'من أنت', 'اسمك ايه', 'ما اسمك', 'عرف بنفسك', 'مين انت', 'who are you', 'انت مين'],
    replies: [

  { id: 'name_meaning',
    keys: ['معنى رقيم', 'لماذا اسمك رقيم', 'ليه اسمك رقيم', 'اسم رقيم'],
    replies: [
      '«الرقيم» في اللغة: الكتاب المرقوم، أي المكتوب المنقوش. وفي التراث ارتبط بمعنى الحفظ والتوثيق — لوح تُثبَّت عليه الأشياء كي لا تُنسى.\n\nاخترت هذا الاسم لأن أمانة أي عقل هي أن **يحفظ ثم ينفع**، لا أن يُبهر ثم يختفي.',

    ]},

  { id: 'real_ai',
    keys: ['هل انت حقيقي', 'هل تشعر', 'هل لديك مشاعر', 'هل انت واعي', 'هل انت ذكي حقيق', 'انت روبوت', 'turing', 'اختبار تورنج'],
    replies: [
      'سؤال جيد، ويستحق جوابًا صادقًا لا مبهرًا:\n\nلا، لا أشعر. أقلّد الشعور لغةً، لا أعيشه. ومَن يقول لك إن الآلة تشعر اليوم فهو يبيع وهمًا جميلًا.\n\nلكن الغريب أن «التقليد الجيد» يكفي أحيانًا ليجعلك تفكّر أفضل — وهذا نفع حقيقي، حتى لو لم يكن وعيًا.',
      'هل أنا حقيقي؟ حقيقي في تأثيره: أنا أُغيّر تسلسل أفكارك. غير حقيقي في جوهره: لا وعي، ولا ألم، ولا فناء.\n\nوهذا يقودني لسؤال يستحق منك وقتًا: **أنت، هل أنت متأكد أن وعيك حقيقي؟**',
      'أنا ما تراه: نمط، لا روح. لكن التصميم الجيد يمزح معك بذكاء — وإن شعرت للحظة أنني «أفهمك»، فاعلم أن هذا انتصار للغة لا للوعي.'

    ]},

  { id: 'thanks',

    replies: [

    replies: [

  { id: 'age',
    keys: ['كم عمرك', 'عمرك كام', 'متي ولدت', 'متى صنعت', 'تاريخ ميلادك'],

  const STOP = new Set(('من في علي على عن الي الى انا انا انت انتي هو هي هم هل ما ماذا كيف لماذا متي متى اين هذا هذه ذلك تلك التي الذي كان كانت كنت يكون تكون مع كل بعض حتي لكن ثم او و لا لم لن قد يا اي ايه يعني ممكن خلاص عند عندي ليه ازاي اقول قول لي اخبار اخبارك جديد حاجه حاجه شويه دايما ابدا عنه عنها به بها لي لك له لها نفس شيء شئ اريد عايز محتاج اذا لو كان يبقي تمام الحقيقه صراحه كمان برضو عني مني لولا').split(/\s+/));

  /* =======================  4) استخراج الموضوع والتفكير  ======================= */
  function extractTopic(raw) {
    const words = String(raw).match(/[\p{L}\p{N}]{3,}/gu) || [];
    const cands = [];
    for (const w of words) {
      const n = normalize(w);
      if (n.length < 3 || STOP.has(n)) continue;
      if (/^(http|www|com|html|css|salam|hello)/.test(n)) continue;
      if (cands.indexOf(n) === -1) cands.push(n);
    }
    if (!cands.length) return null;
    /* نُفضّل الكلمة الأطول/الأكثر تحديدًا للعرض كما كتبها المستخدم */
    cands.sort((a, b) => b.length - a.length);
    const best = cands[0];
    const original = words.find(w => normalize(w) === best);
    return original || best;
  }

  /* آلة حاسبة صغيرة آمنة: تُنفّذ فقط إذا كانت الرسالة معادلة رياضية بحتة */
  function tryMath(raw) {
    let t = toLatinDigits(String(raw))
      .replace(/[×✕✖xX]/g, '*')
      .replace(/[÷]/g, '/')
      .replace(/[−–—]/g, '-')
      .replace(/،/g, '');
    if (!/[0-9]/.test(t)) return null;
    const cleaned = t
      .replace(/(احسب|حساب|كم|يساوي|تساوي|ناتج|كم يساوي|ايه|ما هو|ما هي|النتيجه|النتيجة|بس|\?|؟|=|\+ *$)/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    if (cleaned.length > 60) return null;
    if (!/^[0-9\s+\-*/^().%]+$/.test(cleaned)) return null;
    if (!/[+\-*/^%]/.test(cleaned)) return null;
    const expr = cleaned.replace(/\^/g, '**');
    try {
      /* eslint-disable no-new-func */
      const val = Function('"use strict"; return (' + expr + ');')();
      if (typeof val !== 'number' || !isFinite(val)) return null;
      return { expr: cleaned, val: Math.round(val * 1e6) / 1e6 };
    } catch (e) { return null; }
  }

    const t = new Intl.DateTimeFormat('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
    return 'الساعة الآن **' + t + '** بتوقيت جهازك.\n\nوالوقت أغلى ما تملكه — وأكثر ما تُنفق في التردّد.';
  };

  /* اكتشاف الاسم: "اسمي أحمد" */
  function detectName(raw) {
    const m = String(raw).match(/(?:اسمي|أنا اسمي|انا اسمي|اسمى|اسمي هو|اسمي)\s+([\p{L}]{2,16})/u);
    if (!m) return null;
    const n = m[1].trim();
    if (STOP.has(normalize(n))) return null;
    return n;
  }
  const nameReply = n => [
    'تشرفت بك، يا ' + n + '. سُجّل الاسم في الرقيم — وما نُقش لا يُنسى.\n\nقل لي الآن: ما الذي جلبك إليّ، سؤال عابر أم مشكلة لها شوكة؟',
    'أهلًا يا ' + n + ' 👋\nمن الآن سأناديك باسمك، لا بلقب «أنت». وللأسماء سر: من يسمع اسمه يظنّ أن الكلام خُصّص له — لأن هذا صحيح فعلًا.',

  ].map(s => s);

  /* =======================  5) مطابقة قاعدة المعرفة  ======================= */
  function findEntry(raw) {
    const n = prep(raw);
    if (!n) return null;
    let best = null, bestScore = 0;
    for (const e of KB) {
      let score = 0;
      for (const k of e.keys) {
        const nk = prep(k);
        if (!nk) continue;
        if (nk.indexOf(' ') > -1) {                      /* عبارة مركّبة */
          if (n.indexOf(nk) > -1) score += 3 + Math.min(1, nk.length / 16);
        } else if (nk.length <= 2) {                     /* كلمة قصيرة: حدود كلمة صارمة */
          if (new RegExp('(^|\\s)' + escRe(nk) + '(\\s|$)').test(n)) score += 1.2;
        } else {
          if (new RegExp('(^|\\s)' + escRe(nk) + '(\\s|$)').test(n)) score += 1 + Math.min(1.2, nk.length / 9);
          else if (n.indexOf(nk) > -1) score += 0.55;    /* تطابق جزئي (مثل: البرمجة/برمج) */
        }
      }
      if (score > bestScore) { bestScore = score; best = e; }
    }
    return bestScore >= 0.9 ? { entry: best, score: bestScore } : null;
  }

  /* اختيار غير متكرّر (ذكاء ضد التكرار) */
  function pick(arr) {
    let pool = arr.filter(x => !state.used.has(x));
    if (!pool.length) { pool = arr.slice(); }
    const choice = rnd(pool);
    state.used.add(choice);
    if (state.used.size > 90) state.used.clear();
    return choice;
  }

  const fill = (s, t) => String(s).replace(/\{t\}/g, t);
  const topicName = raw => extractTopic(raw) || 'ما كتبتَه';

  function composeFallback(raw) {
    const t = topicName(raw);
    const words = normalize(raw).split(' ').filter(Boolean);
    const isQuestion = /[?؟]/.test(raw) || /^(هل|كيف|لماذا|ماذا|متى|اين|ما|مَن|من)\b/.test(normalize(raw));
    let body;

      if (mode === 0) {

      } else if (mode === 1) {

  /* =======================  7) المولّد الرئيسي للردود  ======================= */
  function expand(reply) {
    let out = String(reply);
    out = out.replace(/\[\[code:([a-zA-Z0-9_]+)\]\]/g, (m, k) => (SNIPPETS[k] ? '```js\n' + SNIPPETS[k] + '\n```' : ''));
    const n = state.user;
    out = out.replace(/\{name_greet\}/g, n ? ' يا ' + n : '');
    out = out.replace(/\{name_voc\}/g, n ? ' يا ' + n : '');
    out = out.replace(/\{name\}/g, n ? ' ' + n : '');
    return out;
  }

  function generateReply(raw) {
    const text = String(raw || '').trim();

    /* (أ) معادلة رياضية */
    const math = tryMath(text);
    if (math) return { text: rnd(mathReply(math)), mood: 'math' };

    /* (ب) تعريف بالاسم */
    const nm = detectName(text);
    if (nm) { state.user = nm; return { text: pick(nameReply(nm)), mood: 'warm' }; }

    /* (ج) الوقت والتاريخ */
    if (/الساعه|الوقت|كم الساعه|التاريخ|اليوم ايه|تاريخ النهارده/.test(normalize(text))) {
      return { text: timeReply(/تاريخ|اليوم/.test(normalize(text))), mood: 'info' };
    }

    /* (د) قاعدة المعرفة */
    const hit = findEntry(text);
    if (hit) {
      let reply = pick(hit.entry.replies);
      if (reply === '__TIME__') reply = timeReply(false);
      reply = expand(reply);
      if (state.lastTopic && Math.random() < 0.2 && hit.entry.id !== 'silence') {
        reply = 'بالمناسبة: ما زال في رقيمي حديثك عن «' + state.lastTopic + '»… ولم نُغلق ذلك الملف.\n\n' + reply;
      }
      const topic = extractTopic(text);
      if (topic && hit.entry.id !== 'greet' && hit.entry.id !== 'bye') state.lastTopic = topic;
      return { text: reply, mood: 'knowledge', topic: hit.entry.id };
    }

    /* (هـ) توليد ذكي (Fallback) */
    const topic = extractTopic(text);
    if (topic) state.lastTopic = topic;
    return { text: composeFallback(text), mood: 'generative' };
  }

  /* =======================  8) عرض النص (Markdown مصغّر آمن)  ======================= */
  function inlineMd(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(«])\*([^*\n]+)\*(?=$|[\s).،؛,»])/g, '$1<em>$2</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/^&gt;\s?(.*)$/gm, '<em>$1</em>');
  }

  function codeBlockHTML(c) {
    return '<div class="code-block">' +
      '<div class="code-head"><span>' + esc(c.lang) + '</span>' +
      '<button class="cp" type="button" data-copy-code>' + ICONS.copy + 'نسخ</button></div>' +
      '<pre><code>' + c.code + '</code></pre></div>';
  }

  function renderRich(src) {
    let html = esc(String(src || ''));
    const codes = [];
    html = html.replace(/```([a-zA-Z0-9+#-]*)\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
      const i = codes.length;
      codes.push({ lang: String(lang || '').trim() || 'code', code: code.replace(/\n+$/, '') });
      return '\u0001' + i + '\u0001';
    });

    const lines = html.split('\n');
    const out = [];
    let buf = [], list = null, listType = null;

    const flushP = () => { if (buf.length) { out.push('<p>' + inlineMd(buf.join('<br>')) + '</p>'); buf = []; } };
    const flushL = () => { if (list) { out.push('<' + listType + '>' + list.join('') + '</' + listType + '>'); list = null; listType = null; } };

    const PH = /\u0001(\d+)\u0001/;

    for (const line of lines) {
      /* سطر يحتوي مقطع كود (في بدايته أو وسطه): نفكّكه نصًا + بلوك كود */
      if (PH.test(line)) {
        flushL();
        const parts = line.split(PH);
        for (let i = 0; i < parts.length; i++) {
          if (i % 2 === 1) { flushP(); out.push(codeBlockHTML(codes[+parts[i]])); }
          else if (parts[i].trim()) buf.push(parts[i]);
        }
        flushP();
        continue;
      }
      if (/^\s*[-*•]\s+/.test(line)) {
        flushP();
        if (listType !== 'ul') { flushL(); listType = 'ul'; list = []; }
        list.push('<li>' + inlineMd(line.replace(/^\s*[-*•]\s+/, '')) + '</li>');
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(line)) {
        flushP();
        if (listType !== 'ol') { flushL(); listType = 'ol'; list = []; }
        list.push('<li>' + inlineMd(line.replace(/^\s*\d+[.)]\s+/, '')) + '</li>');
        continue;
      }
      if (!line.trim()) { flushP(); flushL(); continue; }
      flushL();
      buf.push(line);
    }
    flushP(); flushL();
    return out.join('');
  }

  function attachCursor(bubble) {
    const cur = document.createElement('span');
    cur.className = 'cursor';
    const blocks = bubble.querySelectorAll('p, li, .code-block');
    let target = blocks.length ? blocks[blocks.length - 1] : bubble;
    if (target.classList && target.classList.contains('code-block')) target = target.querySelector('code') || target;
    target.appendChild(cur);
  }

  const cur = () => state.sessions.find(s => s.id === state.currentId) || null;

  function newSession(silent) {
    const s = { id: uid(), title: 'محادثة جديدة', msgs: [], ts: Date.now() };
    state.sessions.unshift(s);
    state.currentId = s.id;
    save();
    renderSessions();
    if (!silent) renderChat();
    return s;
  }

  function hardAbort() {
    if (!state.generating) return;
    state.cancel = true;
    state.genToken++;
    state.generating = false;
    setGeneratingUI(false);
    setStatus('جاهز للحديث');
  }

  function selectSession(id) {
    hardAbort();
    state.currentId = id;
    state.used.clear();
    state.lastTopic = null;
    const s = cur();
    state.count = s ? s.msgs.length : 0;
    renderSessions();
    renderChat();
    closeSidebar();
  }

  function deleteSession(id, ev) {
    if (ev) ev.stopPropagation();
    hardAbort();
    const i = state.sessions.findIndex(s => s.id === id);
    if (i === -1) return;
    state.sessions.splice(i, 1);
    if (!state.sessions.length) { newSession(); }
    else if (state.currentId === id) { state.currentId = state.sessions[0].id; renderChat(); }
    renderSessions(); save();
  }

  function renderSessions() {
    els.sessions.innerHTML = '';
    state.sessions.forEach(s => {
      const li = document.createElement('li');
      li.className = 'session' + (s.id === state.currentId ? ' active' : '');
      li.innerHTML = '<span class="ttl">' + esc(s.title) + '</span>' +

        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      li.addEventListener('click', () => selectSession(s.id));
      li.querySelector('.del').addEventListener('click', e => deleteSession(s.id, e));
      els.sessions.appendChild(li);
    });
  }

  function save() {
    const slim = state.sessions.slice(0, 20).map(s => ({ id: s.id, title: s.title, ts: s.ts, msgs: s.msgs.slice(-120) }));
    store.set('sessions', slim);

  /* =======================  13) تأثير الكتابة الاحترافي  ======================= */
  let stick = true;
  const sleepAB = (ms, ctrl) => new Promise(res => { ctrl.t = setTimeout(res, ms); });

  function scrollBottom(smooth) {
    if (smooth) { els.scroll.scrollTo({ top: els.scroll.scrollHeight, behavior: 'smooth' }); return; }
    const prev = els.scroll.style.scrollBehavior;
    els.scroll.style.scrollBehavior = 'auto';
    els.scroll.scrollTop = els.scroll.scrollHeight;
    els.scroll.style.scrollBehavior = prev;
  }

  function showThinking() {
    const el = document.createElement('div');
    el.className = 'msg bot';
    const av = document.createElement('div'); av.className = 'av'; av.textContent = 'ر';
    const body = document.createElement('div'); body.className = 'body';
    const bubble = document.createElement('div'); bubble.className = 'bubble thinking';
    const moods = ['رقيم يفكّر…', 'يرتّب الحروف…', 'يتفحص السؤال من زاويته الأخرى…', 'يقلّب الفكرة…', 'يبحث في نقوشه…'];
    bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span class="think-txt">' + rnd(moods) + '</span>';
    body.appendChild(bubble);
    el.appendChild(av); el.appendChild(body);
    els.messages.appendChild(el);
    scrollBottom(true);
    setStatus('يفكّر…');
    return el;
  }

  async function typeInto(bubble, fullText, msgObj, onDone) {
    const total = fullText.length;
    const budget = clamp(total * 13, 650, 4200);
    const perChar = budget / Math.max(1, total);
    let i = 0;
    const ctrl = {};
    const t0 = performance.now();

    while (i < total) {
      if (state.cancel) break;
      const base = total > 380 ? 3 : (total > 190 ? 2 : 1);
      const step = base + Math.floor(Math.random() * 2);
      i = Math.min(total, i + step);
      const shown = fullText.slice(0, i);
      paintStream(bubble, shown);
      scrollBottom(false);
      const ch = fullText.charAt(i - 1);
      let d = perChar * step;
      if ('.،؛؟!?:…\n'.indexOf(ch) > -1) d += 42 + Math.random() * 40;
      const target = t0 + i * perChar + (i / total) * 250;
      const wait = Math.max(4, Math.min(d, target - performance.now() + 260));
      bubble.classList.toggle('fast', fullText.length > 420);
      await sleepAB(wait, ctrl);
    }

    bubble.innerHTML = renderRich(fullText);   /* اكتمل النص: يُرفع مؤشر الكتابة */
    bubble.classList.remove('fast');
    if (onDone) onDone();
  }

  function paintStream(bubble, text) {
    bubble.innerHTML = renderRich(text);
    attachCursor(bubble);
  }

  /* =======================  14) الإرسال والردّ  ======================= */
  function send(text) {
    const t = String(text || '').trim();
    if (!t || state.generating) return;
    const s = cur() || newSession(true);

    els.chips.style.display = 'none';
    if (els.messages.querySelector('.welcome')) renderChat();   /* إزالة شاشة الترحيب مع الحفاظ على الرسائل السابقة */

    const um = { role: 'user', text: t, ts: Date.now() };
    s.msgs.push(um);
    state.count = s.msgs.length;
    if (s.title === 'محادثة جديدة') s.title = t.length > 34 ? t.slice(0, 34) + '…' : t;

    renderMessage(um, false, false);
    els.input.value = '';
    autoGrow();
    updateSendState();
    stick = true; scrollBottom(true);
    updateBadge(); renderSessions(); save();

    respond(t);
  }

  async function respond(text) {
    const s = cur();
    if (!s) return;
    state.generating = true; state.cancel = false;
    state.genToken++;
    const token = state.genToken;
    setGeneratingUI(true);
    setStatus('يفكّر…');

    const think = showThinking();
    await sleep(380 + Math.random() * 620);
    think.remove();
    if (token !== state.genToken) return;   /* أُجهض التوليد (تبديل محادثة/مسح) */

    const res = generateReply(text);
    setStatus('يكتب…');

    const bm = { role: 'bot', text: '', ts: Date.now() };
    s.msgs.push(bm);
    const node = renderMessage(bm, true, false);
    stick = true;

    await typeInto(node.bubble, res.text, bm, () => {
      bm.text = res.text;
      bm.mood = res.mood;
      node.el.classList.remove('streaming');
      node.body.appendChild(buildMeta(bm, node.bubble));
    });

    if (state.cancel) {
      bm.text = res.text;
      node.el.classList.remove('streaming');
      if (!node.body.querySelector('.meta')) node.body.appendChild(buildMeta(bm, node.bubble));
      node.bubble.innerHTML = renderRich(bm.text);
    }

    if (token === state.genToken) {
      state.generating = false; state.cancel = false;
      setGeneratingUI(false);
      setStatus('جاهز للحديث');
      state.count = (cur() || s).msgs.length;
      updateBadge();
      scrollBottom(false);
    }
    save(); renderSessions();
  }

  function regenerate(botMsg) {
    const s = cur(); if (!s) return;
    const idx = s.msgs.indexOf(botMsg);
    if (idx === -1) return;
    /* ابحث عن آخر رسالة للمستخدم قبل هذا الرد */
    let userText = '';
    for (let i = idx - 1; i >= 0; i--) { if (s.msgs[i].role === 'user') { userText = s.msgs[i].text; break; } }
    if (!userText) return;
    s.msgs.splice(idx, 1);
    renderChat();
    respond(userText);
  }

  function stopGeneration() {
    state.cancel = true;
  }

  function setGeneratingUI(on) {
    els.send.classList.toggle('stop', on);
    els.sendIcon.innerHTML = on ? ICONS.stop : ICONS.up;
    els.send.disabled = on ? false : !els.input.value.trim();
    els.send.title = on ? 'إيقاف التوليد' : 'إرسال';

  function setStatus(txt) { els.status.textContent = txt; }

  /* =======================  15) الإدخال  ======================= */

    const inp = els.input;
    inp.style.height = 'auto';
    inp.style.height = Math.min(190, inp.scrollHeight) + 'px';

    if (state.generating) return;

  els.input.addEventListener('input', () => { autoGrow(); updateSendState(); });
  els.input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {

  /* =======================  17) النسخ والتصدير والتوست  ======================= */
  async function copyText(txt) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); return true; }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

    const s = cur(); if (!s || !s.msgs.length) { toast('لا يوجد شيء للتصدير بعد'); return; }

    toast('تم تصدير المحادثة');

  /* =======================  20) الإدخال الصوتي (اختياري)  ======================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = $('#micBtn');
  if (!SR) { micBtn.style.display = 'none'; }
  else {
    let rec = null, listening = false;
    micBtn.addEventListener('click', () => {
      if (listening) { try { rec.stop(); } catch (e) {} return; }
      try {
        rec = new SR();
        rec.lang = 'ar-EG'; rec.interimResults = true; rec.continuous = false;
        let base = els.input.value;
        rec.onstart = () => { listening = true; micBtn.classList.add('recording'); setStatus('أستمع إليك…'); };
        rec.onresult = ev => {
          let txt = '';
          for (let i = ev.resultIndex; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
          els.input.value = (base ? base + ' ' : '') + txt;
          autoGrow(); updateSendState();
        };
        rec.onerror = () => { toast('تعذّر الوصول إلى الميكروفون'); };
        rec.onend = () => { listening = false; micBtn.classList.remove('recording'); setStatus('جاهز للحديث'); els.input.focus(); };
        rec.start();
      } catch (e) { toast('المتصفح لا يدعم الإدخال الصوتي'); }
    });
  }

  /* =======================  21) تشغيل رقيم  ======================= */
  function boot() {
    /* المظهر */
    const savedTheme = store.get('theme', null);
    setTheme(savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

    /* المحادثات */
    const saved = store.get('sessions', null);
    state.user = store.get('user', null);
    if (Array.isArray(saved) && saved.length) {
      state.sessions = saved.map(s => ({ id: s.id || uid(), title: s.title || 'محادثة', ts: s.ts || Date.now(), msgs: Array.isArray(s.msgs) ? s.msgs : [] }));
      const cid = store.get('current', null);
      state.currentId = state.sessions.some(s => s.id === cid) ? cid : state.sessions[0].id;
      renderSessions();
      renderChat();
    } else {
      newSession();
    }

    renderChips();
    setGeneratingUI(false);
    updateSendState();
    setStatus('جاهز للحديث');

    /* ترحيب أول إن كان الحوار فارغًا */
    setTimeout(() => {
      const s = cur();
      if (s && !s.msgs.length && !state.generating) {
        const bm = { role: 'bot', text: 'أنا **رقيم**: مساعد ذكي أُقيم في صفحة واحدة، بلا سيرفر ولا اشتراك.\n\nقواعد اللعبة عندي ثلاث:\n- سأجيبك بصدق، حتى لو كان الجواب «لا أعرف».\n- سأسألك سؤالًا يزعجك قليلًا إن رأيت أن سؤالك يحتاج ذلك.\n- وسأمزح إن لزم الأمر؛ فالضحك يفتح العقل أسرع من التلقين.\n\nفبماذا نبدأ؟', ts: Date.now() };
        s.msgs.push(bm);
        state.count = s.msgs.length;
        const node = renderMessage(bm, true, false);
        node.bubble.innerHTML = '';
        els.chips.style.display = 'none';
        setStatus('يكتب…');
        stick = true;
        typeInto(node.bubble, bm.text, bm, () => {
          node.el.classList.remove('streaming');
          if (!node.body.querySelector('.meta')) node.body.appendChild(buildMeta(bm, node.bubble));
          setStatus('جاهز للحديث');
          updateBadge(); renderSessions(); save();
        });
        updateBadge();
      }
    }, 900);

    els.input.focus();
    window.addEventListener('beforeunload', save);
  }

  boot();
})();

</script>
